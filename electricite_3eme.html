<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voltio, révisions d'électricité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f8; --grid:#d9e3ed; --card:#ffffff; --ink:#14213d; --muted:#55627c; --line:#c9d4e0;
  --volt:#f5b700; --volt-deep:#b98a00; --volt-ink:#2b2000; --red:#d62839; --accent:#1d5fd1;
  --ok:#1b7f45; --ok-bg:#dcf3e4; --bad:#b92a36; --bad-bg:#fbe1e3;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12261f; --grid:#193329; --card:#1b352b; --ink:#eef4ee; --muted:#a6bbb0; --line:#34544a;
    --accent:#8fc1ff; --red:#ff6b78; --ok:#6bd896; --ok-bg:#173d2a; --bad:#ff8d94; --bad-bg:#4a1f25;
  }
}
:root[data-theme="dark"]{
  --bg:#12261f; --grid:#193329; --card:#1b352b; --ink:#eef4ee; --muted:#a6bbb0; --line:#34544a;
  --accent:#8fc1ff; --red:#ff6b78; --ok:#6bd896; --ok-bg:#173d2a; --bad:#ff8d94; --bad-bg:#4a1f25;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; color:var(--ink); font:400 17px/1.5 var(--body);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
#app{height:100%; max-width:560px; margin:0 auto}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2{font-family:var(--display); line-height:1.15; margin:0}

/* home */
.home{padding:16px 18px 40px}
.top{display:flex; align-items:center; gap:10px; margin-bottom:26px}
.logo{font:800 22px var(--display); margin-right:auto}
.stat{background:var(--card); border:2px solid var(--line); border-radius:999px; padding:3px 12px; font-weight:700; font-size:15px}
.lang{background:none; border:2px solid var(--ink); border-radius:999px; padding:3px 12px; font-weight:700; font-size:15px}
.home h1{font-size:clamp(30px,8vw,40px); font-weight:800; max-width:13em}
.home .intro{color:var(--muted); margin:10px 0 26px; max-width:34em}
.path{list-style:none; margin:0; padding:0; position:relative}
.path::before{content:""; position:absolute; left:30px; top:30px; bottom:30px; width:3px; background:var(--ink)}
.path li{position:relative; margin-bottom:14px}
.node{display:flex; align-items:center; gap:16px; width:100%; text-align:left; background:none; border:0; padding:4px 0}
.lamp{flex:none; width:64px; height:64px; border-radius:50%}
.lamp svg{display:block; width:64px; height:64px}
.lamp circle{fill:var(--card); stroke:var(--ink); stroke-width:3}
.lamp path{stroke:var(--ink); stroke-width:3; stroke-linecap:round; fill:none}
.lit .lamp{box-shadow:0 0 0 7px color-mix(in srgb,var(--volt) 35%,transparent)}
.lit .lamp circle{fill:var(--volt); stroke:#14213d} .lit .lamp path{stroke:#14213d}
.nt{display:flex; flex-direction:column; background:var(--card); border:2px solid var(--line); border-bottom-width:4px; border-radius:16px; padding:10px 14px; flex:1}
.nt strong{font:600 19px/1.2 var(--display)}
.nt span{color:var(--muted); font-size:15px}
.nt .stars{color:var(--volt-deep); letter-spacing:2px; font-size:15px}
.node:active .nt{transform:translateY(2px); border-bottom-width:2px; margin-bottom:2px}
.reset{background:none; border:0; color:var(--muted); text-decoration:underline; font-size:14px; margin-top:22px; padding:6px 0}

/* lesson */
.lesson{display:flex; flex-direction:column; height:100%}
.bar{display:flex; align-items:center; gap:12px; padding:14px 16px}
.x{background:none; border:0; font-size:22px; line-height:1; padding:6px 8px; color:var(--muted)}
.prog{flex:1; height:14px; background:var(--card); border:2px solid var(--line); border-radius:999px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--volt); border-radius:999px; transition:width .35s ease}
.step{flex:1; overflow-y:auto; padding:8px 18px 20px}
.step h2{font-size:23px; font-weight:600; margin-bottom:16px}
.chip{display:inline-block; background:var(--bad-bg); color:var(--bad); font-weight:700; font-size:14px; border-radius:999px; padding:2px 12px; margin-bottom:10px}
.lead{font-size:18px; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:16px; margin:0}
.doc{background:var(--card); border:2px solid var(--line); border-left:7px solid var(--volt); border-radius:6px 16px 16px 6px; padding:12px 14px; margin:0 0 16px; font-size:16px}
.doc b{display:block; font-family:var(--display); margin-bottom:4px}
.fig{background:var(--card); border:2px solid var(--line); border-radius:16px; margin:0 0 16px; padding:6px; overflow-x:auto}
.fig svg,.figopt svg{display:block; width:100%; max-width:400px; margin:0 auto; color:var(--ink)}
.ft{font:700 13px var(--body); fill:currentColor}
.ft.hl{fill:var(--red)}
.flow{--p:18.1; stroke:var(--red); stroke-width:5.5; stroke-linecap:round; fill:none; stroke-dasharray:.1 18; animation:flow 1.1s linear infinite}
@keyframes flow{from{stroke-dashoffset:var(--p)} to{stroke-dashoffset:0}}
.tap,.zone{cursor:pointer}
.rk{display:inline-flex; width:28px; height:28px; border-radius:50%; border:2px solid var(--line); margin-right:10px; align-items:center; justify-content:center; font-weight:700; font-size:15px; vertical-align:middle}
.sel .rk{border-color:var(--accent)}
.chip.vote{background:var(--card); color:var(--ink); border:2px solid var(--line)}
.cls{display:block; margin:0 0 22px}
.tray{display:flex; align-items:center; gap:12px; color:var(--muted); font-size:15px; margin-bottom:6px}
.token{flex:none; width:58px; height:58px; border-radius:50%; border:3px solid var(--ink); background:var(--volt); color:#14213d; font:800 22px var(--display); touch-action:none; cursor:grab; box-shadow:0 4px 0 var(--volt-deep)}
.token.drag{position:relative; z-index:5; cursor:grabbing; box-shadow:0 10px 18px rgba(0,0,0,.3)}
.pick{margin:0 0 6px; font-weight:700; font-size:15px; color:var(--muted)}
.tbl{width:100%; border-collapse:collapse; margin-top:12px; background:var(--card); font-size:17px}
.tbl th,.tbl td{border:2px solid var(--line); padding:7px 8px; text-align:center}
.tbl input{width:84px; font:inherit; color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:8px; padding:5px 6px; text-align:center}
.tbl input.good{border-color:var(--ok); background:var(--ok-bg)} .tbl input.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opts{display:grid; gap:10px}
.opt{border:2px solid var(--line); border-bottom-width:4px; border-radius:14px; background:var(--card); padding:12px 14px; text-align:left; min-height:52px}
.opt.figopt{padding:4px}
.opt.sel{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.opt.good{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt:disabled{cursor:default; color:inherit}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.cols .opt{text-align:center}
.num{display:flex; align-items:center; gap:10px; font:600 22px var(--display)}
.num input{width:150px; font:inherit; color:var(--ink); background:var(--card); border:2px solid var(--line); border-bottom-width:4px; border-radius:14px; padding:10px 14px}
.mwrap{display:grid; grid-template-columns:130px 1fr; gap:14px; align-items:start}
.meter{width:130px; display:block}
.meter text{font:700 13px var(--body); fill:#2b2000; text-anchor:middle}
.meter .lcd{font:700 17px ui-monospace,Menlo,monospace; fill:#14213d; text-anchor:end}
.mrow{margin-bottom:10px}
.mrow p{margin:0 0 5px; font-weight:700; font-size:15px; color:var(--muted)}
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg .opt{min-height:42px; padding:7px 12px; font-size:16px}
@media (max-width:380px){.mwrap{grid-template-columns:1fr} .meter{margin:0 auto}}
.foot{padding:14px 18px 18px; border-top:2px solid var(--line); background:var(--bg)}
.foot.ok{background:var(--ok-bg); border-color:var(--ok)}
.foot.bad{background:var(--bad-bg); border-color:var(--bad)}
.fb{margin-bottom:12px}
.fb strong{font:800 20px var(--display)}
.foot.ok .fb strong{color:var(--ok)} .foot.bad .fb strong{color:var(--bad)}
.fb p{margin:4px 0 0; font-size:16px}
.fb .corr{font-weight:700}
.hint{margin:0; color:var(--muted)}
.btn{display:block; width:100%; background:var(--volt); color:var(--volt-ink); border:0; border-radius:14px; padding:14px 18px; font:800 18px var(--display); box-shadow:0 4px 0 var(--volt-deep)}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--volt-deep)}
.btn:disabled{background:var(--line); color:var(--muted); box-shadow:none; cursor:default; transform:none}
.btn.ghost{background:none; color:var(--ink); box-shadow:none; border:2px solid var(--line); margin-top:10px}

/* result */
.result{min-height:100%; display:flex; flex-direction:column; justify-content:center; padding:24px 22px; text-align:center}
.result .lamp{width:120px; height:120px; margin:0 auto 26px; animation:glow 1.1s ease-out both}
.result .lamp svg{width:120px; height:120px}
.result .lamp circle{animation:fillup 1.1s ease-out both}
@keyframes glow{from{box-shadow:0 0 0 0 transparent} to{box-shadow:0 0 0 18px color-mix(in srgb,var(--volt) 35%,transparent)}}
@keyframes fillup{from{fill:#fff} to{fill:var(--volt)}}
.result h1{font-size:32px; font-weight:800}
.result .stars{font-size:34px; color:var(--volt-deep); letter-spacing:6px; margin:8px 0}
.result p{margin:4px 0 24px; color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   CONTENT. To add a question, copy a line into the "steps" of a unit.
   Types:  info  (title, body)
           mcq   (q, o: options, THE FIRST OPTION IS THE CORRECT ONE, shuffled on screen)
                 or of: two drawings to choose from (first one correct)
           match (q, p: pairs [left, right])
           num   (q, ans: number, unit)
           meter (q, ans: [dial V|A|O|OFF, sockets V|A, connection], w: the two connection choices)
   Every text is {fr:"…", en:"…"} or a plain string used for both languages.
   doc: a text shown above the question (reading exercise).
   fig: {top:[…], bot:[…] components on the top / bottom wire,
         br:[[…],[…]] branches (1 or 2 components each),
         g: battery label, i: main current label, arr: 1 / -1 arrows, flow: moving dots, off: no current}
   ===================================================================== */
const Lp=(n,l,x)=>Object.assign({c:"lamp",n,l},x), Rs=(n,l)=>({c:"res",n,l}), Am=l=>({c:"A",l}), Vm=l=>({c:"V",l});
const SW={c:"sw"}, SWO={c:"swo"}, MOT={c:"mot",n:"M"};
const WSP=[{v:"ser",l:{fr:"en série, dans la boucle",en:"in series, inside the loop"}},{v:"par",l:{fr:"en dérivation, aux bornes de la lampe",en:"in parallel, across the lamp"}}];
const WOHM=[{v:"out",l:{fr:"résistor seul, sorti du circuit",en:"resistor alone, out of the circuit"}},{v:"in",l:{fr:"résistor laissé dans le circuit avec la pile",en:"resistor left in the circuit with the battery"}}];
const MIX=(a,b,c,g,i)=>({br:[[Lp("L₁",a)],[Lp("L₂",b),Lp("L₃",c)]],g:g,i:i});
const DOC={fr:"<b>La guirlande d'Inès</b>Pour son anniversaire, Inès reçoit une guirlande lumineuse de 2 mètres pour décorer sa chambre. Sur l'étiquette, elle lit : « Alimentation : pile de 4,5 V. 10 lampes branchées en dérivation. Courant dans chaque lampe : 20 mA (soit 0,02 A). Prix : 7,90 €. » Un soir, une des lampes grille. Curieuse, Inès place un ampèremètre juste à la sortie de la pile : il affiche 180 mA (soit 0,18 A).",
           en:"<b>Inès's fairy lights</b>For her birthday, Inès gets a 2-metre string of fairy lights for her bedroom. The label says: “Power: 4.5 V battery. 10 lamps connected in parallel. Current in each lamp: 20 mA (that is 0.02 A). Price: €7.90.” One evening, one of the lamps blows. Curious, Inès places an ammeter right next to the battery: it reads 180 mA (that is 0.18 A)."};

const U=[
{id:"pw", title:"La puissance", sub:"3e : à quelle vitesse l'énergie est dépensée", steps:[
 {t:"info", title:"Cinq cyclistes pour une bouilloire",
  body:"Un cycliste du Tour de France, à fond, développe environ 400 watts. Ta bouilloire en demande 2 000. Pour faire chauffer l'eau de ton thé à la force des jambes, il faudrait donc cinq champions qui pédalent ensemble. Ce nombre de watts, c'est la puissance. Et elle est écrite sur tous les appareils de la maison."},
 {t:"info", title:"Le même travail, plus ou moins vite",
  body:"Deux élèves montent chacune le même sac jusqu'au troisième étage. Lina met 20 secondes, Jade en met 60. Elles ont fourni le même travail : le sac est arrivé à la même hauteur, il a fallu la même énergie. Mais Lina l'a fait trois fois plus vite : elle a développé trois fois plus de puissance. L'énergie, c'est ce qu'il faut dépenser pour accomplir un travail : soulever, chauffer, éclairer, faire tourner. La puissance, c'est l'énergie fournie chaque seconde."},
 {t:"mcq", nb:1, q:"Lina monte le sac en 20 s, Jade en 60 s. Que peut-on dire ?",
  o:["Même énergie dépensée, mais Lina a été trois fois plus puissante","Lina a dépensé trois fois plus d'énergie","Même énergie et même puissance"],
  why:"Le travail fourni est le même. La puissance dit à quelle vitesse il est fait."},
 {t:"mcq", q:"Sur une ampoule, on lit « 9 W ». Quelle est la grandeur ?",
  o:["La puissance","Le watt","9"],
  why:"La puissance est la grandeur, le watt est l'unité, 9 est la valeur. On écrit P = 9 W."},
 {t:"match", q:"Associe chaque grandeur à son unité.",
  p:[["Puissance","watt"],["Énergie","joule"],["Tension","volt"],["Intensité","ampère"],["Durée","seconde"]],
  why:"La puissance en watts, l'énergie en joules : ce sont les deux nouvelles de l'année."},
 {t:"match", q:"Grandeurs et unités mélangées : retrouve le symbole de chacune.",
  p:[["la puissance","P"],["le watt","W"],["l'énergie","E"],["le joule","J"],["la durée","t"]],
  why:"P, E et t sont des grandeurs. W et J sont des unités. On écrit P = 2 000 W, jamais W = 2 000 P."},
 {t:"order", q:"Touche ces appareils dans l'ordre, du moins puissant au plus puissant.",
  o:["Ampoule LED","Ordinateur portable","Bouilloire","Voiture","TGV"],
  why:"Ampoule LED : 10 W. Ordinateur portable : 50 W. Bouilloire : 2 000 W. Voiture : environ 75 000 W. TGV : environ 9 000 000 W."},
 {t:"mcq", q:"Pour la même lumière, une ampoule LED demande 9 W et une ancienne ampoule à filament 60 W. Pourquoi la LED est-elle préférable ?",
  o:["Elle dépense moins d'énergie chaque seconde pour le même éclairage","Elle éclaire six fois plus","Elle fonctionne avec une tension plus petite"],
  why:"L'ampoule à filament transforme presque toute son énergie en chaleur. Même service rendu, six fois moins de puissance."},
 {t:"info", title:"D'où vient la puissance d'un appareil ?",
  body:"Pense à un barrage : sa puissance dépend de la hauteur de la chute et du débit de l'eau. En électricité, c'est pareil : la tension pousse, l'intensité dit combien il passe. La puissance est le produit des deux : P = U × I, avec P en watts, U en volts et I en ampères."},
 {t:"num", fig:{top:[{c:"res",n:"R = 100 Ω",vm:"V",vl:"3 V"}],bot:[Am("0,03 A")],flow:1}, q:"Comme en TP : aux bornes du résistor de 100 Ω, le voltmètre affiche 3 V, et l'ampèremètre indique 0,03 A. Quelle est la puissance reçue par le résistor ?", ans:0.09, unit:"W",
  why:"P = U × I = 3 × 0,03 = 0,09 W. C'est minuscule : plus de vingt mille fois moins qu'une bouilloire. Voilà pourquoi le résistor du TP chauffe à peine."},
 {t:"num", q:"Une bouilloire branchée sur le 230 V est parcourue par un courant de 9 A. Quelle est sa puissance ?", ans:2070, unit:"W",
  why:"P = U × I = 230 × 9 = 2 070 W, environ 2 kW. Les cinq cyclistes du début."},
 {t:"mcq", q:"Un chargeur indique « 5 V – 2 A », un autre « 20 W ». Que change le second ?",
  o:["Il fournit l'énergie deux fois plus vite : 20 W contre 5 × 2 = 10 W","Il fournit deux fois plus de tension, c'est tout","Rien, c'est le même"],
  why:"Charger une batterie, c'est lui fournir une certaine énergie. Plus la puissance est grande, plus c'est rapide."},
 {t:"num", q:"Un radiateur de 2 300 W est branché sur le 230 V. Quelle intensité le traverse ?", ans:10, unit:"A",
  why:"I = P ÷ U = 2 300 ÷ 230 = 10 A. Plus un appareil est puissant, plus il appelle de courant."},
 {t:"mcq", q:"Une multiprise porte l'indication « 3 500 W max ». On y branche une bouilloire de 2 000 W et un radiateur de 2 000 W. Que se passe-t-il ?",
  o:["La limite est dépassée : les puissances s'additionnent, 4 000 W","Tout va bien : aucun appareil ne dépasse 3 500 W","La tension est divisée par deux"],
  why:"Les prises sont en dérivation : les intensités s'ajoutent, donc les puissances aussi. La multiprise chauffe : risque d'incendie."}
]},
{id:"conv", title:"Convertir sans se tromper", sub:"3e : milli, kilo, méga, minutes et heures", steps:[
 {t:"info", title:"Trois préfixes à connaître",
  body:"milli (m) = mille fois plus petit : 1 mA = 0,001 A<br>kilo (k) = mille fois plus grand : 1 kW = 1 000 W<br>méga (M) = un million de fois plus grand : 1 MW = 1 000 000 W<br><br>Pour vérifier une conversion, une seule question : l'unité d'arrivée est-elle plus petite ? Alors il en faut davantage, et le nombre doit grandir. Elle est plus grande ? Le nombre doit diminuer."},
 {t:"match", q:"Associe chaque préfixe à ce qu'il signifie.",
  p:[["milli (m)","mille fois plus petit"],["kilo (k)","mille fois plus grand"],["méga (M)","un million de fois plus grand"],["aucun préfixe","l'unité de base"]],
  why:"Attention aux majuscules : m pour milli, M pour méga. Entre 5 mW et 5 MW, il y a un facteur d'un milliard."},
 {t:"num", q:"Un ampèremètre affiche 250 mA. Combien cela fait-il en ampères ?", ans:0.25, unit:"A",
  why:"L'ampère est mille fois plus grand que le milliampère : on divise par 1 000."},
 {t:"num", q:"En TP, tu calcules I = 0,03 A. Combien cela fait-il en milliampères ?", ans:30, unit:"mA",
  why:"Le milliampère est plus petit, il en faut davantage : on multiplie par 1 000."},
 {t:"order", q:"Touche ces intensités dans l'ordre, de la plus petite à la plus grande.",
  o:["0,05 A","500 mA","2 A","3 000 mA"],
  why:"Tout en ampères : 0,05 A, 0,5 A, 2 A, 3 A. On ne compare jamais deux valeurs qui n'ont pas la même unité."},
 {t:"num", q:"Sur un résistor, on lit 2,2 kΩ. Combien cela fait-il en ohms ?", ans:2200, unit:"Ω",
  why:"Kilo : on multiplie par 1 000. C'est cette valeur en ohms qu'il faut mettre dans U = R × I."},
 {t:"num", q:"Une bouilloire a une puissance de 2 000 W. Combien cela fait-il en kilowatts ?", ans:2, unit:"kW",
  why:"Le kilowatt est mille fois plus grand que le watt : on divise par 1 000."},
 {t:"mcq", q:"Un TGV développe 9 MW. Combien cela fait-il en watts ?",
  o:["9 000 000 W","9 000 W","0,009 W"],
  why:"Méga : un million. 9 MW, c'est la puissance de 4 500 bouilloires."},
 {t:"mcq", q:"Une ligne électrique est à 20 kV. Combien cela fait-il en volts ?",
  o:["20 000 V","2 000 V","0,02 V"],
  why:"Kilo : on multiplie par 1 000."},
 {t:"info", title:"Le piège des minutes",
  body:"Une heure ne fait pas 100 minutes mais 60. Pour passer des minutes aux heures, on divise par 60 : 30 min = 0,5 h, 15 min = 0,25 h, 6 min = 0,1 h. Pour passer des heures aux secondes, on multiplie par 3 600, car 60 × 60 = 3 600."},
 {t:"mcq", q:"1 h 30 min, en heures, cela fait…",
  o:["1,5 h","1,30 h","90 h"],
  why:"30 minutes, c'est une demi-heure, donc 0,5 h. Écrire 1,30 h est l'erreur la plus fréquente."},
 {t:"num", q:"Un appareil fonctionne pendant 15 minutes. Combien cela fait-il en heures ?", ans:0.25, unit:"h",
  why:"15 ÷ 60 = 0,25 h : un quart d'heure."},
 {t:"num", q:"Combien y a-t-il de secondes dans 2 heures ?", ans:7200, unit:"s",
  why:"2 × 3 600 = 7 200 s. C'est la durée à utiliser pour obtenir une énergie en joules."},
 {t:"num", q:"Un compteur indique 500 Wh. Combien cela fait-il en kilowattheures ?", ans:0.5, unit:"kWh",
  why:"Comme pour les watts et les kilowatts : on divise par 1 000."},
 {t:"mcq", q:"Un sèche-cheveux de 1 800 W fonctionne 30 minutes. Pour calculer l'énergie en kWh avec E = P × t, quelles valeurs faut-il utiliser ?",
  o:["P = 1,8 kW et t = 0,5 h","P = 1 800 W et t = 30 min","P = 1,8 kW et t = 30 min"],
  why:"Des kilowatts multipliés par des heures donnent des kilowattheures : E = 1,8 × 0,5 = 0,9 kWh. Sans conversion, on trouverait 54 000."}
]},
{id:"en", title:"L'énergie et la facture", sub:"3e : des joules, des kilowattheures et des euros", steps:[
 {t:"info", title:"Ce que tu paies vraiment",
  body:"La facture d'électricité ne compte pas des watts. Elle compte de l'énergie : la puissance des appareils multipliée par le temps pendant lequel ils fonctionnent. C'est pour cela qu'une petite box internet, allumée jour et nuit, peut coûter plus cher qu'une grosse bouilloire utilisée trois minutes."},
 {t:"info", title:"Énergie = puissance × durée",
  body:"E = P × t. Avec P en watts et t en secondes, l'énergie est en joules : un joule, c'est un watt pendant une seconde. C'est minuscule. Pour la maison, on préfère P en kilowatts et t en heures : l'énergie est alors en kilowattheures. Un kilowattheure (kWh), c'est un appareil de 1 000 W qui fonctionne pendant une heure, soit 3 600 000 joules."},
 {t:"match", q:"Unité de quoi ? Attention à kW et kWh.",
  p:[["le kilowatt (kW)","une puissance"],["le kilowattheure (kWh)","une énergie"],["l'heure (h)","une durée"],["le volt (V)","une tension"]],
  why:"Le kWh n'est pas un « kilowatt par heure » : c'est un kilowatt multiplié par une heure, donc une énergie."},
 {t:"mcq", q:"Trouve la phrase correcte.",
  o:["Le four a consommé une énergie de 3 kWh","Le four a une puissance de 3 kWh","Le four a consommé une énergie de 3 kW"],
  why:"L'énergie se compte en kWh (ou en joules), la puissance en kW (ou en watts)."},
 {t:"num", q:"Une lampe de 10 W reste allumée 60 secondes. Quelle énergie a-t-elle consommée ?", ans:600, unit:"J",
  why:"E = P × t = 10 × 60 = 600 J. Watts et secondes donnent des joules."},
 {t:"num", q:"Un four de 2 000 W, soit 2 kW, fonctionne pendant 1,5 h. Quelle énergie a-t-il consommée ?", ans:3, unit:"kWh",
  why:"E = P × t = 2 × 1,5 = 3 kWh. Kilowatts et heures donnent des kilowattheures."},
 {t:"mcq", q:"En France, en 2026, 1 kWh coûte environ 0,20 € au tarif réglementé. Combien coûte une cuisson au four qui consomme 3 kWh ?",
  o:["0,60 €","6,00 €","0,07 €"],
  why:"3 × 0,20 = 0,60 €. Le compteur de la maison additionne les kWh de tous les appareils, toute l'année."},
 {t:"mcq", q:"Qui consomme le plus d'énergie en une journée : une bouilloire de 2 000 W utilisée 3 minutes, ou une box internet de 10 W allumée 24 h ?",
  o:["La box : 0,01 kW × 24 h = 0,24 kWh","La bouilloire : 2 000 W, c'est énorme","Les deux pareil"],
  why:"Bouilloire : 2 kW × 0,05 h = 0,1 kWh. Box : 0,24 kWh. Une petite puissance pendant longtemps finit par dépasser une grande puissance pendant un instant."},
 {t:"mcq", q:"Une console laissée en veille consomme 10 W, jour et nuit, toute l'année (8 760 heures). À 0,20 € le kWh, combien cela coûte-t-il environ ?",
  o:["Environ 18 €","Environ 2 €","Environ 180 €"],
  why:"E = 0,01 kW × 8 760 h = 87,6 kWh. 87,6 × 0,20 = 17,50 € environ, pour un appareil qui ne fait rien."},
 {t:"mcq", q:"Un moteur de 100 W et un moteur de 200 W soulèvent chacun la même charge à la même hauteur. Que peut-on dire ?",
  o:["Ils fournissent le même travail, mais le second le fait deux fois plus vite","Le second fournit deux fois plus de travail","Le premier ne peut pas y arriver"],
  why:"Même charge, même hauteur : même énergie à fournir. Avec E = P × t, deux fois plus de puissance signifie deux fois moins de temps."},
 {t:"mcq", q:"Pourquoi la facture est-elle en kilowattheures plutôt qu'en joules ?",
  o:["Le joule est trop petit : 1 kWh vaut 3 600 000 J","Le joule ne mesure pas l'énergie","Le kWh est une unité de puissance"],
  why:"Une famille consomme plusieurs milliers de kWh par an. En joules, la facture afficherait des dizaines de milliards."}
]},
{id:"ui", title:{fr:"Tension ou intensité ?",en:"Voltage or current?"}, sub:{fr:"Ce qui pousse et ce qui passe",en:"What pushes and what flows"}, steps:[
 {t:"info", title:{fr:"L'oiseau et la ligne à 20 000 volts",en:"The bird on the 20,000 volt line"},
  body:{fr:"Un oiseau se pose sur une ligne électrique à 20 000 V et chante tranquillement. Toi, tu ne dois jamais t'en approcher. Pourquoi lui ne risque-t-il rien ? Pour le comprendre, il faut arrêter de confondre la tension et l'intensité. Réponse à la fin de la leçon.",
        en:"A bird lands on a 20,000 V power line and sings happily. You must never go near one. Why is the bird safe? To understand, you have to stop mixing up voltage and current. Answer at the end of the lesson."}},
 {t:"info", title:{fr:"Pense à un toboggan aquatique",en:"Think of a water slide"},
  body:{fr:"La tension, c'est la différence de hauteur entre le haut et le bas : c'est elle qui pousse. Elle existe toujours entre deux points. L'intensité, c'est le débit : la quantité d'eau qui passe chaque seconde. L'eau fait tout le tour du parcours : le débit appartient au circuit entier, pas à un seul endroit. Sans pente, rien ne coule. Mais une pente peut exister sans qu'aucune eau ne coule.",
        en:"Voltage is the height difference between the top and the bottom: it does the pushing. It always exists between two points. Current is the flow rate: how much water passes each second. The water goes all the way round: the flow belongs to the whole circuit, not to one spot. With no slope, nothing flows. But a slope can exist with no water flowing at all."}},
 {t:"info", title:{fr:"Dans le ventre de la pile",en:"Inside the battery"},
  body:{fr:"Une pile ne fabrique pas d'électrons : les fils en sont déjà pleins. À l'intérieur, une réaction chimique arrache des électrons d'un côté et les entasse à la borne −, pendant que la borne + en manque. Ce déséquilibre, c'est la tension. Pour rejoindre la borne +, les électrons n'ont qu'un chemin : faire le tour par le circuit. La pile les y pousse, comme une pompe remonte l'eau en haut du toboggan. Quand ses produits chimiques sont épuisés, la pile est usée.",en:"A battery does not make electrons: the wires are already full of them. Inside, a chemical reaction pulls electrons from one side and piles them up at the − terminal, while the + terminal is short of them. That imbalance is the voltage. To reach the + terminal, the electrons have only one way: round the circuit. The battery pushes them along, like a pump lifting water back to the top of the slide. When its chemicals are used up, the battery is flat."}},
 {t:"mcq", q:{fr:"Que fait une pile dans un circuit ?",en:"What does a battery do in a circuit?"},
  o:[{fr:"Grâce à une réaction chimique, elle pousse les électrons déjà présents dans les fils",en:"Through a chemical reaction, it pushes the electrons already present in the wires"},{fr:"Elle fabrique des électrons",en:"It makes electrons"},{fr:"Elle contient du courant en réserve",en:"It holds a store of current"}],
  why:{fr:"Elle transforme de l'énergie chimique en énergie électrique. Une pile usée a épuisé ses produits chimiques, pas ses électrons.",en:"It turns chemical energy into electrical energy. A flat battery has run out of chemicals, not electrons."}},
 {t:"mcq", nb:1, q:{fr:"Sur le toboggan, l'eau coule grâce à la différence de hauteur. En électricité, qu'est-ce qui joue ce rôle ?",en:"On the slide, water flows because of the height difference. In electricity, what plays that role?"},
  o:[{fr:"La tension",en:"Voltage"},{fr:"L'intensité",en:"Current"},{fr:"La résistance",en:"Resistance"}],
  why:{fr:"La tension est la « poussée » entre deux points du circuit.",en:"Voltage is the “push” between two points of the circuit."}},
 {t:"mcq", nb:1, q:{fr:"Et le débit de l'eau, en litres par seconde, correspond à…",en:"And the water flow rate, in litres per second, corresponds to…"},
  o:[{fr:"L'intensité du courant",en:"The current"},{fr:"La tension",en:"The voltage"},{fr:"La pile",en:"The battery"}],
  why:{fr:"L'intensité dit combien d'électricité circule chaque seconde dans le circuit.",en:"Current tells you how much electricity flows round the circuit each second."}},
 {t:"mcq", q:{fr:"Une pile de 4,5 V est posée sur la table, reliée à rien. Que peut-on dire ?",en:"A 4.5 V battery sits on the table, connected to nothing. What is true?"},
  o:[{fr:"Il y a une tension entre ses bornes, mais aucun courant",en:"There is a voltage across its terminals, but no current"},{fr:"Il n'y a ni tension ni courant",en:"There is neither voltage nor current"},{fr:"Il y a un courant, mais pas de tension",en:"There is a current, but no voltage"}],
  why:{fr:"La tension existe même sans circuit. Le courant, lui, a besoin d'une boucle fermée pour circuler.",en:"Voltage exists even with no circuit. Current needs a closed loop to flow."}},
 {t:"mcq", fig:{top:[Lp("L₁"),Lp("L₂")],bot:[SWO],g:"6 V",off:true}, q:{fr:"L'interrupteur est ouvert. Quelle est l'intensité du courant dans le circuit ?",en:"The switch is open. What is the current in the circuit?"},
  o:["0 A","6 A",{fr:"On ne peut pas savoir",en:"Impossible to know"}],
  why:{fr:"Boucle ouverte : rien ne circule, nulle part. Pourtant la pile a toujours 6 V entre ses bornes. Tension sans intensité, c'est possible.",en:"Open loop: nothing flows, anywhere. Yet the battery still has 6 V across its terminals. Voltage without current is possible."}},
 {t:"mcq", fig:{top:[Am("?"),Lp("L"),Am({fr:"0,3 A",en:"0.3 A"})],bot:[SW],flow:1}, q:{fr:"Un ampèremètre est placé avant la lampe, un autre après. Le second affiche 0,3 A. Qu'affiche le premier ?",en:"One ammeter is placed before the lamp, another after. The second reads 0.3 A. What does the first read?"},
  o:[{fr:"0,3 A aussi",en:"0.3 A as well"},{fr:"Plus de 0,3 A : la lampe consomme du courant",en:"More than 0.3 A: the lamp uses up current"},"0 A"],
  why:{fr:"La lampe ne « mange » pas le courant. Il circule dans toute la boucle avec la même intensité partout. Ce que la lampe prend, c'est de l'énergie.",en:"The lamp does not “eat” current. It flows round the whole loop with the same value everywhere. What the lamp takes is energy."}},
 {t:"info", fig:{top:[Lp("L₁","2 V",{vm:"V"}),Lp("L₂","4 V",{vm:"V"})],bot:[Am({fr:"0,3 A",en:"0.3 A"})],g:"6 V",flow:1}, title:{fr:"Une tension par élément, un courant pour le circuit",en:"One voltage per component, one current for the circuit"},
  body:{fr:"Chaque lampe a sa propre tension : 2 V aux bornes de L₁, 4 V aux bornes de L₂. Une tension se mesure sur un élément, entre ses deux bornes. L'intensité, elle, n'appartient à aucune lampe : 0,3 A, c'est le courant de toute la boucle. On dit « la tension aux bornes de la lampe », mais « l'intensité dans le circuit » (ou dans une branche, s'il y en a plusieurs).",en:"Each lamp has its own voltage: 2 V across L₁, 4 V across L₂. A voltage is measured on one component, between its two terminals. The current belongs to no lamp: 0.3 A is the current of the whole loop. We say “the voltage across the lamp”, but “the current in the circuit” (or in a branch, if there are several)."}},
 {t:"mcq", q:{fr:"Quelle phrase est correcte ?",en:"Which sentence is correct?"},
  o:[{fr:"La tension aux bornes de la lampe vaut 2 V et l'intensité dans le circuit vaut 0,3 A",en:"The voltage across the lamp is 2 V and the current in the circuit is 0.3 A"},{fr:"La tension dans le circuit vaut 2 V et l'intensité aux bornes de la lampe vaut 0,3 A",en:"The voltage in the circuit is 2 V and the current across the lamp is 0.3 A"},{fr:"La tension et l'intensité de la lampe valent 2 V et 0,3 A",en:"The lamp's voltage and current are 2 V and 0.3 A"}],
  why:{fr:"Une tension concerne un élément, entre deux points. Une intensité concerne tout le chemin que suit le courant.",en:"A voltage is about one component, between two points. A current is about the whole path the current follows."}},
 {t:"mcq", q:{fr:"En touchant une poignée de porte, tu reçois une décharge de plusieurs milliers de volts. Un courant traverse bien ton doigt, et pourtant ce n'est pas dangereux. Pourquoi ?",en:"Touching a door handle, you get a shock of several thousand volts. A current really does go through your finger, yet it is not dangerous. Why?"},
  o:[{fr:"Ce courant est minuscule et ne dure qu'un instant",en:"That current is tiny and lasts only an instant"},{fr:"Parce que les volts ne font jamais mal",en:"Because volts never hurt"},{fr:"Parce qu'aucun courant ne passe",en:"Because no current flows at all"}],
  why:{fr:"Le picotement que tu sens, c'est ce petit courant. Il s'arrête tout de suite, car il y a très peu d'électricité à faire passer. Une tension énorme ne veut pas dire un courant énorme.",en:"The tingle you feel is that small current. It stops at once, because there is very little electricity to move. A huge voltage does not mean a huge current."}},
 {t:"match", q:{fr:"Qui dit quoi ?",en:"Who says what?"},
  p:[[{fr:"Tension",en:"Voltage"},{fr:"« Je pousse »",en:"“I push”"}],[{fr:"Intensité",en:"Current"},{fr:"« Je compte ce qui circule par seconde »",en:"“I count what flows each second”"}],[{fr:"Résistance",en:"Resistance"},{fr:"« Je freine »",en:"“I slow things down”"}]],
  why:{fr:"Trois grandeurs, trois rôles différents.",en:"Three quantities, three different jobs."}},
 {t:"mcq", nb:1, q:{fr:"Retour à l'oiseau. Ses deux pattes sont sur le même fil. Pourquoi ne s'électrocute-t-il pas ?",en:"Back to the bird. Both feet are on the same wire. Why is it not electrocuted?"},
  o:[{fr:"Entre ses deux pattes, la tension est presque nulle, donc aucun courant ne le traverse",en:"Between its two feet the voltage is almost zero, so no current flows through it"},{fr:"Ses pattes sont isolantes",en:"Its feet are insulators"},{fr:"Le courant de la ligne est trop faible",en:"The current in the line is too small"}],
  why:{fr:"Les 20 000 V sont entre le fil et le sol, pas entre ses deux pattes. S'il touchait en même temps le fil et le pylône, ce serait fatal.",en:"The 20,000 V is between the wire and the ground, not between its two feet. If it touched the wire and the pylon at once, it would be fatal."}}
]},
{id:"qu", title:{fr:"Grandeur ou unité ?",en:"Quantity or unit?"}, sub:{fr:"Ce qu'on mesure, et en quoi on le compte",en:"What you measure, and what you count it in"}, steps:[
 {t:"info", title:{fr:"« Ma tension est de 12 ampères »",en:"“My voltage is 12 amperes”"},
  body:{fr:"Cette phrase sonne aussi faux que « je mesure 1,60 kilogramme ». Une grandeur, c'est ce qu'on mesure : une longueur, une tension. Une unité, c'est ce qui sert à la compter : le mètre, le volt. Les mélanger est l'erreur qui coûte le plus de points en contrôle.",
        en:"That sentence sounds as wrong as “I am 1.60 kilograms tall”. A quantity is what you measure: a length, a voltage. A unit is what you count it in: the metre, the volt. Mixing them up is the mistake that costs the most marks in tests."}},
 {t:"mcq", q:{fr:"« La table mesure 2 mètres. » Quelle est la grandeur ?",en:"“The table is 2 metres long.” What is the quantity?"},
  o:[{fr:"La longueur",en:"Length"},{fr:"Le mètre",en:"The metre"},"2"],
  why:{fr:"La longueur est la grandeur, le mètre est l'unité, 2 est la valeur.",en:"Length is the quantity, the metre is the unit, 2 is the value."}},
 {t:"match", q:{fr:"Associe chaque grandeur à son unité.",en:"Match each quantity with its unit."},
  p:[[{fr:"Tension",en:"Voltage"},"volt"],[{fr:"Intensité",en:"Current"},{fr:"ampère",en:"ampere"}],[{fr:"Résistance",en:"Resistance"},"ohm"],[{fr:"Longueur",en:"Length"},{fr:"mètre",en:"metre"}]],
  why:{fr:"Tension en volts, intensité en ampères, résistance en ohms.",en:"Voltage in volts, current in amperes, resistance in ohms."}},
 {t:"match", q:{fr:"Grandeurs et unités mélangées : retrouve le symbole de chacune. Attention à U et V !",en:"Quantities and units mixed together: find the symbol of each. Watch out for U and V!"},
  p:[[{fr:"la tension",en:"voltage"},"U"],[{fr:"le volt",en:"the volt"},"V"],[{fr:"l'intensité",en:"current"},"I"],[{fr:"l'ampère",en:"the ampere"},"A"],[{fr:"la résistance",en:"resistance"},"R"]],
  why:{fr:"U, I, R sont des grandeurs. V, A, Ω sont des unités. On écrit U = 4,5 V.",en:"U, I, R are quantities. V, A, Ω are units. We write U = 4.5 V."}},
 {t:"mcq", q:{fr:"Dans « I = 0,25 A », que représentent, dans l'ordre, I, 0,25 et A ?",en:"In “I = 0.25 A”, what are I, 0.25 and A, in that order?"},
  o:[{fr:"La grandeur, la valeur, l'unité",en:"The quantity, the value, the unit"},{fr:"L'unité, la valeur, la grandeur",en:"The unit, the value, the quantity"},{fr:"La grandeur, l'unité, la valeur",en:"The quantity, the unit, the value"}],
  why:{fr:"I est l'intensité (la grandeur), A est l'ampère (l'unité).",en:"I is the current (the quantity), A is the ampere (the unit)."}},
 {t:"mcq", q:{fr:"Lequel de ces mots est une unité ?",en:"Which of these words is a unit?"},
  o:[{fr:"L'ampère",en:"The ampere"},{fr:"L'intensité",en:"Current"},{fr:"La tension",en:"Voltage"},{fr:"La résistance",en:"Resistance"}],
  why:{fr:"Les trois autres sont des grandeurs.",en:"The other three are quantities."}},
 {t:"mcq", q:{fr:"Trouve la phrase correcte.",en:"Find the correct sentence."},
  o:[{fr:"L'intensité du courant est de 0,2 A.",en:"The current is 0.2 A."},{fr:"La tension est de 0,2 A.",en:"The voltage is 0.2 A."},{fr:"L'ampère du courant est de 0,2 I.",en:"The ampere of the circuit is 0.2 I."}],
  why:{fr:"Les ampères vont avec l'intensité, les volts avec la tension.",en:"Amperes go with current, volts go with voltage."}},
 {t:"mcq", q:{fr:"Sur un chargeur de téléphone, on lit « 5 V – 2 A ». Que représente « 5 V » ?",en:"A phone charger says “5 V – 2 A”. What does “5 V” stand for?"},
  o:[{fr:"La tension qu'il délivre",en:"The voltage it supplies"},{fr:"L'intensité qu'il délivre",en:"The current it supplies"},{fr:"Sa résistance",en:"Its resistance"}],
  why:{fr:"V comme volt : c'est une tension. Les 2 A sont l'intensité maximale qu'il peut fournir.",en:"V for volt: it is a voltage. The 2 A is the maximum current it can supply."}},
 {t:"mcq", q:{fr:"250 mA, cela fait combien d'ampères ?",en:"How many amperes is 250 mA?"},
  o:[{fr:"0,25 A",en:"0.25 A"},{fr:"2,5 A",en:"2.5 A"},{fr:"25 A",en:"25 A"},{fr:"0,025 A",en:"0.025 A"}],
  why:{fr:"1 A = 1000 mA, donc on divise par 1000.",en:"1 A = 1000 mA, so divide by 1000."}}
]},
{id:"sp", title:{fr:"Série, dérivation et sens du courant",en:"Series, parallel and current direction"}, sub:{fr:"Une boucle ou plusieurs, et dans quel sens",en:"One loop or several, and which way round"}, steps:[
 {t:"info", title:{fr:"La guirlande maudite",en:"The cursed fairy lights"},
  body:{fr:"Sur les vieilles guirlandes de Noël, une seule ampoule grillée et tout s'éteint. Chez toi, quand l'ampoule du salon grille, la cuisine reste allumée. Même électricité, deux façons de brancher.",
        en:"On old fairy lights, one dead bulb and everything goes dark. At home, when the living room bulb dies, the kitchen stays lit. Same electricity, two ways of wiring."}},
 {t:"mcq", fig:{top:[Lp("L₁"),Lp("L₂")],bot:[SW],flow:1}, q:{fr:"Comment ces deux lampes sont-elles branchées ?",en:"How are these two lamps connected?"},
  o:[{fr:"En série",en:"In series"},{fr:"En dérivation",en:"In parallel"}],
  why:{fr:"Une seule boucle : le même courant passe dans tous les dipôles, l'un après l'autre.",en:"A single loop: the same current goes through every component, one after the other."}},
 {t:"mcq", fig:{top:[SW],br:[[Lp("L₁")],[Lp("L₂")]],flow:1}, q:{fr:"Comment ces deux lampes sont-elles branchées ?",en:"How are these two lamps connected?"},
  o:[{fr:"En dérivation",en:"In parallel"},{fr:"En série",en:"In series"}],
  why:{fr:"Il y a deux boucles : au nœud, le courant se partage entre les deux branches.",en:"There are two loops: at the node, the current splits between the two branches."}},
 {t:"info", fig:{top:[Lp("L₁"),Lp("L₂")],bot:[SW],flow:1,play:1}, title:{fr:"À toi : dévisse une lampe",en:"Your turn: unscrew a lamp"},
  body:{fr:"Touche une lampe pour la dévisser, touche-la encore pour la revisser. Ici il n'y a qu'une boucle : ouverte à un seul endroit, le courant s'arrête partout.",en:"Tap a lamp to unscrew it, tap again to screw it back. Here there is only one loop: open it in one place and the current stops everywhere."}},
 {t:"info", fig:{br:[[Lp("L₁")],[Lp("L₂")]],flow:1,play:1}, title:{fr:"Suis les couleurs",en:"Follow the colours"},
  body:{fr:"Les deux gros points sont des nœuds : le courant s'y partage, puis s'y regroupe. Une branche est un morceau de circuit entre ces deux nœuds. Il y en a trois ici : la branche principale, qui contient la pile, et deux branches dérivées. Chaque couleur suit une boucle complète qui passe par la pile. Dans la branche principale les deux couleurs voyagent ensemble, au nœud elles se séparent. Dévisse une lampe : seule sa boucle s'arrête.",en:"The two big dots are nodes: the current splits there, then joins again. A branch is a piece of circuit between those two nodes. There are three here: the main branch, which contains the battery, and two side branches. Each colour follows a complete loop through the battery. In the main branch both colours travel together, at the node they separate. Unscrew a lamp: only its loop stops."}},
 {t:"mcq", fig:{br:[[Lp("L₁")],[Lp("L₂")],[Lp("L₃")]],flow:1}, q:{fr:"Combien de branches dérivées ce circuit compte-t-il ?",en:"How many side branches does this circuit have?"},
  o:["3","2","4"],
  why:{fr:"Trois chemins possibles, une couleur par chemin. La branche de la pile, elle, est la branche principale.",en:"Three possible paths, one colour per path. The battery's branch is the main branch."}},
 {t:"mcq", fig:{br:[[Lp("L₁")],[Lp("L₂")]],flow:1}, q:{fr:"Dans quelle branche les points de toutes les couleurs circulent-ils ensemble ?",en:"In which branch do the dots of every colour travel together?"},
  o:[{fr:"Dans la branche principale, celle de la pile",en:"In the main branch, the battery's one"},{fr:"Dans la branche de L₁",en:"In the branch of L₁"},{fr:"Dans aucune",en:"In none"}],
  why:{fr:"La branche principale transporte le courant de toutes les boucles : c'est là que l'intensité est la plus grande.",en:"The main branch carries the current of every loop: that is where the current is largest."}},
 {t:"mcq", of:[{top:[Lp("L")],bot:[SW],arr:1},{top:[Lp("L")],bot:[SW],arr:-1}], q:{fr:"Lequel de ces schémas indique le bon sens du courant ?",en:"Which diagram shows the correct direction of the current?"},
  why:{fr:"Par convention, à l'extérieur de la pile, le courant va de la borne + vers la borne −. La borne + est le grand trait.",en:"By convention, outside the battery, the current goes from the + terminal to the − terminal. The + terminal is the long line."}},
 {t:"mcq", fig:{top:[MOT],bot:[SW],arr:1}, q:{fr:"On retourne la pile de ce circuit. Que fait le moteur ?",en:"The battery in this circuit is turned round. What does the motor do?"},
  o:[{fr:"Il tourne dans l'autre sens",en:"It spins the other way"},{fr:"Il s'arrête",en:"It stops"},{fr:"Rien ne change",en:"Nothing changes"}],
  why:{fr:"Pile retournée, courant inversé. Le moteur y est sensible, une lampe non : elle brille pareil dans les deux sens.",en:"Battery reversed, current reversed. A motor notices; a lamp does not: it shines the same both ways."}},
 {t:"mcq", q:{fr:"Dans les fils, ce sont des électrons qui se déplacent. Dans quel sens vont-ils ?",en:"In the wires, it is electrons that move. Which way do they go?"},
  o:[{fr:"De la borne − vers la borne +, à l'inverse du sens conventionnel",en:"From the − terminal to the + terminal, opposite to the conventional direction"},{fr:"De la borne + vers la borne −",en:"From the + terminal to the − terminal"},{fr:"Ils ne bougent pas",en:"They do not move"}],
  why:{fr:"Le sens du courant a été choisi bien avant la découverte de l'électron. Trop tard pour changer : on a gardé la convention.",en:"The direction of current was chosen long before the electron was discovered. Too late to change: the convention stayed."}},
 {t:"mcq", q:{fr:"Dans un circuit en série, on dévisse une lampe. Que fait l'autre ?",en:"In a series circuit, one lamp is unscrewed. What does the other do?"},
  o:[{fr:"Elle s'éteint",en:"It goes out"},{fr:"Elle reste allumée",en:"It stays on"},{fr:"Elle brille plus fort",en:"It shines brighter"}],
  why:{fr:"L'unique boucle est ouverte : plus aucun courant, nulle part. C'est la guirlande maudite.",en:"The only loop is open: no current anywhere. That is the cursed fairy lights."}},
 {t:"mcq", q:{fr:"À la maison, comment les appareils sont-ils branchés ?",en:"At home, how are appliances connected?"},
  o:[{fr:"En dérivation",en:"In parallel"},{fr:"En série",en:"In series"}],
  why:{fr:"Chaque appareil fonctionne indépendamment des autres et reçoit la même tension, 230 V.",en:"Each appliance works independently and gets the same voltage, 230 V."}},
 {t:"mcq", q:{fr:"Dans un circuit, un nœud est…",en:"In a circuit, a node (junction) is…"},
  o:[{fr:"Un point où au moins trois fils se rejoignent",en:"A point where at least three wires meet"},{fr:"Un fil emmêlé",en:"A tangled wire"},{fr:"Une borne de la pile",en:"A terminal of the battery"}],
  why:{fr:"C'est là que le courant se partage ou se regroupe. Il n'y a de nœuds que dans les circuits en dérivation.",en:"That is where the current splits or joins. Only parallel circuits have nodes."}},
]},
{id:"laws", title:{fr:"Les lois en dérivation",en:"The laws in parallel"}, sub:{fr:"Même tension, intensités qui s'ajoutent",en:"Same voltage, currents add up"}, steps:[
 {t:"info", title:{fr:"Clac ! Tout s'éteint",en:"Click! Everything goes dark"},
  body:{fr:"Une multiprise, un radiateur, une bouilloire, un sèche-cheveux… et le disjoncteur saute. Il n'est pas en panne : il applique une loi que tu vas connaître dans cinq minutes.",
        en:"A power strip, a heater, a kettle, a hairdryer… and the circuit breaker trips. It is not broken: it is applying a law you will know in five minutes."}},
 {t:"mcq", fig:{br:[[Lp("L₁","?")],[Lp("L₂")]],g:"6 V"}, q:{fr:"La pile délivre 6 V. Quelle est la tension aux bornes de L₁ ?",en:"The battery supplies 6 V. What is the voltage across L₁?"},
  o:["6 V","3 V","12 V"],
  why:{fr:"En dérivation, la tension est la même aux bornes de chaque branche : U = U₁ = U₂.",en:"In parallel, the voltage is the same across every branch: U = U₁ = U₂."}},
 {t:"num", fig:{br:[[Lp("L₁",{fr:"0,2 A",en:"0.2 A"})],[Lp("L₂",{fr:"0,3 A",en:"0.3 A"})]],i:"I = ?",flow:1}, q:{fr:"Quelle est l'intensité I dans la branche principale ?",en:"What is the current I in the main branch?"}, ans:0.5, unit:"A",
  why:{fr:"Au nœud, le courant se partage : I = I₁ + I₂ = 0,2 + 0,3.",en:"At the node the current splits: I = I₁ + I₂ = 0.2 + 0.3."}},
 {t:"num", fig:{br:[[Lp("L₁",{fr:"0,5 A",en:"0.5 A"})],[Lp("L₂","?")]],i:{fr:"I = 0,9 A",en:"I = 0.9 A"},flow:1}, q:{fr:"Quelle est l'intensité du courant dans la branche de L₂ ?",en:"What is the current in the branch of L₂?"}, ans:0.4, unit:"A",
  why:{fr:"I₂ = I − I₁ = 0,9 − 0,5. Tout ce qui arrive au nœud en repart.",en:"I₂ = I − I₁ = 0.9 − 0.5. Everything that arrives at the node leaves it."}},
 {t:"mcq", q:{fr:"Quelle est la loi des tensions dans un circuit en dérivation ?",en:"What is the voltage law in a parallel circuit?"},
  o:["U = U₁ = U₂","U = U₁ + U₂","U = U₁ − U₂"],
  why:{fr:"Les branches sont reliées aux deux mêmes points : même « différence de hauteur » pour toutes.",en:"The branches connect to the same two points: the same “height difference” for all."}},
 {t:"mcq", q:{fr:"Quelle est la loi des intensités dans un circuit en dérivation ?",en:"What is the current law in a parallel circuit?"},
  o:["I = I₁ + I₂","I = I₁ = I₂","I = I₁ × I₂"],
  why:{fr:"Comme une rivière qui se sépare en deux bras : le débit total est la somme des deux.",en:"Like a river splitting into two arms: the total flow is the sum of the two."}},
 {t:"mcq", fig:{br:[[Lp("L₁",{fr:"0,1 A",en:"0.1 A"})],[Lp("L₂",{fr:"0,1 A",en:"0.1 A"})],[Lp("L₃",{fr:"0,1 A",en:"0.1 A"})]],i:"I = ?",flow:1}, q:{fr:"Trois lampes identiques en dérivation. Quelle intensité sort de la pile ?",en:"Three identical lamps in parallel. What current leaves the battery?"},
  o:[{fr:"0,3 A",en:"0.3 A"},{fr:"0,1 A",en:"0.1 A"},{fr:"0,03 A",en:"0.03 A"}],
  why:{fr:"Les intensités des trois branches s'additionnent.",en:"The currents in the three branches add up."}},
 {t:"mcq", q:{fr:"Sur la même ligne de prises : une bouilloire (9 A) et un radiateur (8 A). Le disjoncteur coupe au-delà de 16 A. Que se passe-t-il ?",en:"On the same line of sockets: a kettle (9 A) and a heater (8 A). The breaker cuts off above 16 A. What happens?"},
  o:[{fr:"Il coupe : 9 + 8 = 17 A",en:"It trips: 9 + 8 = 17 A"},{fr:"Rien : aucun appareil ne dépasse 16 A",en:"Nothing: no appliance exceeds 16 A"},{fr:"La tension monte à 460 V",en:"The voltage rises to 460 V"}],
  why:{fr:"Les prises sont en dérivation : les intensités s'ajoutent dans le fil principal. Trop de courant ferait chauffer les fils dans les murs.",en:"Sockets are in parallel: the currents add up in the main wire. Too much current would heat the wires in the walls."}},
 {t:"mcq", q:{fr:"Chez toi, on allume une lampe de plus. La tension aux bornes des autres lampes…",en:"At home, one more lamp is switched on. The voltage across the other lamps…"},
  o:[{fr:"Ne change pas : toujours 230 V",en:"Does not change: still 230 V"},{fr:"Est divisée par deux",en:"Is halved"},{fr:"Augmente",en:"Increases"}],
  why:{fr:"En dérivation, la tension est la même pour toutes les branches, quel que soit leur nombre.",en:"In parallel, the voltage is the same for every branch, however many there are."}},
 {t:"num", fig:{top:[Lp("L₁","2 V"),Lp("L₂","?")],bot:[SW],g:"6 V"}, q:{fr:"Attention au piège : ce circuit est en série. Quelle est la tension aux bornes de L₂ ?",en:"Watch the trap: this circuit is in series. What is the voltage across L₂?"}, ans:4, unit:"V",
  why:{fr:"En série, c'est l'inverse : les tensions s'additionnent (6 = 2 + 4) et l'intensité est la même partout.",en:"In series it is the other way round: voltages add up (6 = 2 + 4) and the current is the same everywhere."}}
]},
{id:"mix", title:{fr:"Deux lampes dans une branche",en:"Two lamps in one branch"}, sub:{fr:"Un circuit en série caché dans une dérivation",en:"A series circuit hidden inside a parallel one"}, steps:[
 {t:"info", fig:Object.assign(MIX(null,null,null,"6 V"),{flow:1,play:1}), title:{fr:"Le circuit qui en cache un autre",en:"The circuit hiding another"},
  body:{fr:"Ici, la deuxième branche contient deux lampes qui se suivent. Méthode en deux temps. D'abord les branches : chacune est reliée aux deux mêmes nœuds, donc chacune reçoit toute la tension de la pile. Ensuite l'intérieur d'une branche : c'est un petit circuit en série. Dévisse une lampe pour voir quelle boucle s'arrête.",
        en:"Here the second branch contains two lamps in a row. A two-step method. First the branches: each connects to the same two nodes, so each gets the full battery voltage. Then inside a branch: it is a small series circuit. Unscrew a lamp to see which loop stops."}},
 {t:"num", fig:MIX("?",null,null,"6 V"), q:{fr:"Quelle est la tension aux bornes de L₁ ?",en:"What is the voltage across L₁?"}, ans:6, unit:"V",
  why:{fr:"L₁ est seule dans sa branche : elle reçoit toute la tension de la pile.",en:"L₁ is alone in its branch: it gets the full battery voltage."}},
 {t:"mcq", fig:MIX("6 V",null,null,"6 V"), q:{fr:"Quelle est la tension aux bornes de l'ensemble L₂ + L₃ ?",en:"What is the voltage across L₂ + L₃ together?"},
  o:["6 V","3 V","12 V"],
  why:{fr:"La branche entière est reliée aux mêmes nœuds que L₁ et que la pile : 6 V pour toute la branche.",en:"The whole branch connects to the same nodes as L₁ and the battery: 6 V for the whole branch."}},
 {t:"num", fig:MIX("6 V",{fr:"2,5 V",en:"2.5 V"},"?","6 V"), q:{fr:"La tension aux bornes de L₂ vaut 2,5 V. Combien vaut celle aux bornes de L₃ ?",en:"The voltage across L₂ is 2.5 V. What is the voltage across L₃?"}, ans:3.5, unit:"V",
  why:{fr:"L₂ et L₃ sont en série dans leur branche : elles se partagent les 6 V. 6 − 2,5 = 3,5 V.",en:"L₂ and L₃ are in series in their branch: they share the 6 V. 6 − 2.5 = 3.5 V."}},
 {t:"mcq", fig:Object.assign(MIX({fr:"0,3 A",en:"0.3 A"},{fr:"0,2 A",en:"0.2 A"},"?"),{flow:1}), q:{fr:"Le courant dans L₂ vaut 0,2 A. Et dans L₃ ?",en:"The current in L₂ is 0.2 A. And in L₃?"},
  o:[{fr:"0,2 A",en:"0.2 A"},{fr:"0,1 A",en:"0.1 A"},{fr:"0,3 A",en:"0.3 A"}],
  why:{fr:"L₂ et L₃ sont sur le même chemin : c'est le même courant qui passe dans les deux. L'intensité appartient à la branche, pas à une lampe.",en:"L₂ and L₃ are on the same path: the same current goes through both. Current belongs to the branch, not to one lamp."}},
 {t:"num", fig:Object.assign(MIX({fr:"0,3 A",en:"0.3 A"},{fr:"0,2 A",en:"0.2 A"},null,null,"I = ?"),{flow:1}), q:{fr:"Quelle intensité sort de la pile ?",en:"What current leaves the battery?"}, ans:0.5, unit:"A",
  why:{fr:"Deux branches : 0,3 + 0,2 = 0,5 A. On compte les branches, pas les lampes.",en:"Two branches: 0.3 + 0.2 = 0.5 A. Count branches, not lamps."}},
 {t:"mcq", fig:MIX(null,null,null,"6 V"), q:{fr:"On dévisse L₃. Que se passe-t-il ?",en:"L₃ is unscrewed. What happens?"},
  o:[{fr:"L₂ s'éteint, L₁ reste allumée",en:"L₂ goes out, L₁ stays on"},{fr:"Tout s'éteint",en:"Everything goes out"},{fr:"Seule L₃ s'éteint",en:"Only L₃ goes out"}],
  why:{fr:"La branche de L₂ et L₃ est ouverte : plus de courant dans cette branche. Celle de L₁ est toujours une boucle fermée.",en:"The L₂–L₃ branch is open: no current in that branch. The L₁ branch is still a closed loop."}}
]},
{id:"mm", title:{fr:"Le multimètre",en:"The multimeter"}, sub:{fr:"Un appareil, trois métiers",en:"One device, three jobs"}, steps:[
 {t:"info", title:{fr:"Un fusible grillé en une demi-seconde",en:"A fuse blown in half a second"},
  body:{fr:"Voltmètre, ampèremètre, ohmmètre : c'est le même boîtier, tout dépend du réglage. Trois choix à faire à chaque fois : la position de la molette (le sélecteur), les deux bornes utilisées, et la façon de le brancher. Les deux fils, eux, sont identiques : rouge ou noir, ils font le même travail. Mal branché, un ampèremètre grille son fusible aussitôt.",
        en:"Voltmeter, ammeter, ohmmeter: it is the same box, everything depends on the setting. Three choices every time: the position of the dial (the selector), the two sockets used, and how you connect it. The two leads are identical: red or black, they do the same job. Connected wrongly, an ammeter blows its fuse at once."}},
 {t:"match", q:{fr:"Quel appareil mesure quelle grandeur ?",en:"Which instrument measures which quantity?"},
  p:[[{fr:"Voltmètre",en:"Voltmeter"},{fr:"Tension",en:"Voltage"}],[{fr:"Ampèremètre",en:"Ammeter"},{fr:"Intensité",en:"Current"}],[{fr:"Ohmmètre",en:"Ohmmeter"},{fr:"Résistance",en:"Resistance"}]],
  why:{fr:"Le nom de l'appareil contient l'unité : volt, ampère, ohm.",en:"The instrument's name contains the unit: volt, ampere, ohm."}},
 {t:"place", kind:"A", ans:"ser", q:{fr:"Place l'ampèremètre pour mesurer l'intensité du courant dans ce circuit, puis vérifie : l'interrupteur se fermera.",en:"Place the ammeter to measure the current in this circuit, then check: the switch will close."},
  why:{fr:"Le courant circule dans toute la boucle : l'ampèremètre doit en faire partie pour que tout le courant le traverse. Aux bornes de la lampe, il offre un chemin sans résistance : le courant évite la lampe, devient énorme, et le fusible grille.",en:"Current flows round the whole loop: the ammeter must be part of it so that all the current goes through it. Across the lamp, it offers a path with no resistance: the current skips the lamp, becomes huge, and the fuse blows."}},
 {t:"place", kind:"V", ans:"par", q:{fr:"Place maintenant le voltmètre pour mesurer la tension aux bornes de la lampe.",en:"Now place the voltmeter to measure the voltage across the lamp."},
  why:{fr:"La tension est une différence entre deux points : un fil de chaque côté de la lampe, sans ouvrir le circuit. Placé dans la boucle, le voltmètre bloque presque tout le courant et la lampe s'éteint.",en:"Voltage is a difference between two points: one lead on each side of the lamp, without opening the circuit. Placed inside the loop, the voltmeter blocks almost all the current and the lamp goes out."}},
 {t:"meter", w:WSP, q:{fr:"Règle le multimètre pour mesurer la tension aux bornes d'une lampe.",en:"Set the multimeter to measure the voltage across a lamp."}, ans:["V","V","par"],
  why:{fr:"Voltmètre : molette sur V, bornes COM et VΩ, en dérivation.",en:"Voltmeter: dial on V, sockets COM and VΩ, in parallel."}},
 {t:"meter", w:WSP, q:{fr:"Règle-le maintenant pour mesurer l'intensité du courant dans le circuit de la lampe.",en:"Now set it to measure the current in the lamp's circuit."}, ans:["A","A","ser"],
  why:{fr:"Ampèremètre : molette sur A, bornes COM et A, en série. Le courant de la boucle doit passer à travers lui.",en:"Ammeter: dial on A, sockets COM and A, in series. The loop's current has to go through it."}},
 {t:"meter", w:WOHM, q:{fr:"Dernier réglage : mesure la résistance d'un résistor.",en:"Last setting: measure the resistance of a resistor."}, ans:["O","V","out"],
  why:{fr:"Ohmmètre : molette sur Ω, bornes COM et VΩ, et le résistor sorti du circuit.",en:"Ohmmeter: dial on Ω, sockets COM and VΩ, and the resistor taken out of the circuit."}},
 {t:"mcq", q:{fr:"Le fil rouge et le fil noir du multimètre…",en:"The red lead and the black lead of the multimeter…"},
  o:[{fr:"Sont identiques : la couleur aide seulement à se repérer",en:"Are identical: the colour only helps you keep track"},{fr:"Le rouge conduit mieux le courant",en:"The red one conducts better"},{fr:"Le noir ne sert que pour la tension",en:"The black one is only for voltage"}],
  why:{fr:"Ce sont deux fils ordinaires. Ce qui compte, ce sont les bornes où on les branche.",en:"They are two ordinary wires. What matters is which sockets they go into."}},
 {t:"mcq", q:{fr:"Quelle borne sert pour les trois mesures ?",en:"Which socket is used for all three measurements?"},
  o:["COM","A","VΩ"],
  why:{fr:"COM comme « commune ». L'autre borne dépend de la mesure : A pour l'intensité, VΩ pour la tension et la résistance.",en:"COM for “common”. The other socket depends on the measurement: A for current, VΩ for voltage and resistance."}},
 {t:"mcq", q:{fr:"Pourquoi mesure-t-on une résistance avec le composant sorti du circuit ?",en:"Why is resistance measured with the component out of the circuit?"},
  o:[{fr:"L'ohmmètre envoie son propre petit courant ; la pile du circuit fausserait la mesure",en:"The ohmmeter sends its own small current; the circuit's battery would spoil the measurement"},{fr:"Pour ne pas user la pile du circuit",en:"To save the circuit's battery"},{fr:"Parce que la résistance disparaît quand le circuit est fermé",en:"Because resistance vanishes when the circuit is closed"}],
  why:{fr:"L'ohmmètre a sa propre pile. Dans un circuit alimenté, la mesure serait fausse et l'appareil pourrait être abîmé.",en:"The ohmmeter has its own battery. In a powered circuit the reading would be wrong and the meter could be damaged."}},
 {t:"mcq", q:{fr:"Tu ne sais pas du tout quelle valeur tu vas trouver. Par quel calibre commencer ?",en:"You have no idea what value you will find. Which range do you start with?"},
  o:[{fr:"Le plus grand, puis on descend",en:"The largest, then work down"},{fr:"Le plus petit, pour être précis",en:"The smallest, to be precise"},{fr:"N'importe lequel",en:"Any of them"}],
  why:{fr:"Le plus grand calibre protège l'appareil. On descend ensuite pour gagner en précision.",en:"The largest range protects the meter. Then you go down to gain precision."}},
 {t:"mcq", q:{fr:"Le voltmètre affiche −4,5 V. Que s'est-il passé ?",en:"The voltmeter shows −4.5 V. What happened?"},
  o:[{fr:"Il est branché à l'envers : la borne COM est du côté + de la pile",en:"It is connected backwards: the COM socket is on the + side of the battery"},{fr:"La pile est vide",en:"The battery is flat"},{fr:"L'appareil est cassé",en:"The meter is broken"}],
  why:{fr:"Rien de grave : il suffit d'échanger les deux fils. Pour une valeur positive, COM va du côté de la borne −.",en:"Nothing serious: just swap the two leads. For a positive value, COM goes on the − side."}}
]},
{id:"ohm", title:{fr:"Résistance et loi d'Ohm",en:"Resistance and Ohm's law"}, sub:{fr:"Des collisions, puis U = R × I",en:"Collisions, then U = R × I"}, steps:[
 {t:"info", title:{fr:"Le mystère du grille-pain",en:"The toaster mystery"},
  body:{fr:"Le fil dans le grille-pain devient rouge vif. Le cordon qui l'alimente reste froid, alors que c'est le même courant qui passe dans les deux. Que se passe-t-il à l'intérieur du métal ?",
        en:"The wire inside the toaster glows bright red. The cord feeding it stays cool, though it is the same current in both. What is going on inside the metal?"}},
 {t:"info", fig:{k:"atoms"}, title:{fr:"Un flipper pour électrons",en:"A pinball machine for electrons"},
  body:{fr:"Le courant, ce sont des électrons qui avancent dans le métal. Sur leur chemin, ils se cognent sans arrêt aux atomes. Chaque collision les freine et fait vibrer les atomes : le métal chauffe. Plus il y a de collisions, plus la résistance est grande. Le fil du grille-pain est fait d'un alliage où les collisions sont bien plus nombreuses que dans le cuivre du cordon.",
        en:"Current is electrons moving through the metal. On their way they keep bumping into atoms. Each collision slows them and makes the atoms vibrate: the metal heats up. The more collisions, the larger the resistance. The toaster wire is an alloy where collisions are far more frequent than in the copper cord."}},
 {t:"mcq", fig:{k:"atoms"}, q:{fr:"Qu'est-ce qui freine les électrons dans un résistor ?",en:"What slows the electrons down in a resistor?"},
  o:[{fr:"Leurs collisions avec les atomes",en:"Their collisions with atoms"},{fr:"La gaine en plastique",en:"The plastic coating"},{fr:"La tension de la pile",en:"The battery's voltage"}],
  why:{fr:"Ces collisions transforment de l'énergie électrique en chaleur : c'est pour cela qu'un résistor chauffe.",en:"These collisions turn electrical energy into heat: that is why a resistor warms up."}},
 {t:"mcq", fig:{top:[Rs("R")],bot:[Am()],flow:1}, q:{fr:"Avec la même pile, on remplace le résistor par un autre de résistance plus grande. L'intensité dans le circuit…",en:"With the same battery, the resistor is swapped for one with a larger resistance. The current in the circuit…"},
  o:[{fr:"Diminue",en:"Decreases"},{fr:"Augmente",en:"Increases"},{fr:"Ne change pas",en:"Does not change"}],
  why:{fr:"Plus de collisions, donc moins de courant, et cela dans toute la boucle.",en:"More collisions, so less current, and that holds round the whole loop."}},
 {t:"table", R:30, us:[1.5,3,4.5,6], q:{fr:"Change la pile : le voltmètre et l'ampèremètre donnent U et I. Calcule ensuite U ÷ I pour chaque ligne du tableau.",en:"Change the battery: the voltmeter and the ammeter give U and I. Then calculate U ÷ I for each row of the table."},
  why:{fr:"Quand U augmente, I augmente aussi, et U ÷ I donne toujours le même nombre : 30.",en:"When U goes up, I goes up too, and U ÷ I always gives the same number: 30."}},
 {t:"mcq", nb:1, q:{fr:"Dans le tableau, U ÷ I vaut toujours 30, quelle que soit la pile. À quoi correspond ce nombre ?",en:"In the table, U ÷ I is always 30, whatever the battery. What does this number correspond to?"},
  o:[{fr:"À la résistance du résistor : R = 30 Ω",en:"The resistance of the resistor: R = 30 Ω"},{fr:"À la tension de la pile",en:"The battery's voltage"},{fr:"À l'intensité maximale du circuit",en:"The maximum current of the circuit"}],
  why:{fr:"Pour un résistor, U ÷ I ne change jamais : c'est sa résistance. Autrement dit U = R × I. Tu viens de retrouver la loi d'Ohm.",en:"For a resistor, U ÷ I never changes: it is its resistance. In other words U = R × I. You have just rediscovered Ohm's law."}},
 {t:"mcq", q:{fr:"Quelle est la loi d'Ohm ?",en:"What is Ohm's law?"},
  o:["U = R × I","U = R + I","U = R ÷ I"],
  why:{fr:"La tension aux bornes d'un résistor est proportionnelle à l'intensité du courant qui y passe.",en:"The voltage across a resistor is proportional to the current through it."}},
 {t:"mcq", q:{fr:"Pour utiliser U = R × I, l'intensité doit être exprimée en…",en:"To use U = R × I, the current must be in…"},
  o:[{fr:"ampères",en:"amperes"},{fr:"milliampères",en:"milliamperes"},{fr:"volts",en:"volts"}],
  why:{fr:"U en volts, R en ohms, I en ampères. Oublier de convertir les mA est le piège classique.",en:"U in volts, R in ohms, I in amperes. Forgetting to convert mA is the classic trap."}},
 {t:"num", fig:{top:[Object.assign(Rs("R = 100 Ω"),{vm:"V",vl:"?"})],bot:[Am({fr:"0,05 A",en:"0.05 A"})],flow:1}, q:{fr:"Qu'affiche le voltmètre ?",en:"What does the voltmeter read?"}, ans:5, unit:"V",
  why:{fr:"U = R × I = 100 × 0,05.",en:"U = R × I = 100 × 0.05."}},
 {t:"num", q:{fr:"Un résistor de 200 Ω a une tension de 6 V à ses bornes. Quelle est l'intensité du courant ?",en:"A 200 Ω resistor has 6 V across it. What is the current?"}, ans:0.03, unit:"A",
  why:{fr:"I = U ÷ R = 6 ÷ 200 = 0,03 A, soit 30 mA.",en:"I = U ÷ R = 6 ÷ 200 = 0.03 A, that is 30 mA."}},
 {t:"num", q:{fr:"Tension aux bornes d'un résistor : 12 V. Intensité du courant : 0,5 A. Quelle est sa résistance ?",en:"Voltage across a resistor: 12 V. Current: 0.5 A. What is its resistance?"}, ans:24, unit:"Ω",
  why:{fr:"R = U ÷ I = 12 ÷ 0,5.",en:"R = U ÷ I = 12 ÷ 0.5."}},
 {t:"num", q:{fr:"Un courant de 20 mA passe dans un résistor de 220 Ω. Quelle est la tension à ses bornes ?",en:"A current of 20 mA flows in a 220 Ω resistor. What is the voltage across it?"}, ans:4.4, unit:"V",
  why:{fr:"D'abord convertir : 20 mA = 0,020 A. Puis U = 220 × 0,020. Sans conversion, on trouve 4400 V !",en:"Convert first: 20 mA = 0.020 A. Then U = 220 × 0.020. Without converting, you get 4400 V!"}},
]},
{id:"big", title:{fr:"Beaucoup, c'est combien ?",en:"How much is a lot?"}, sub:{fr:"Des volts, des ampères et des ohms qu'on peut se représenter",en:"Volts, amperes and ohms you can picture"}, steps:[
 {t:"info", title:{fr:"50 000 volts contre 230 volts",en:"50,000 volts versus 230 volts"},
  body:{fr:"Un taser envoie environ 50 000 V. Une prise de courant n'en fait que 230. Pourtant, c'est la prise qui tue le plus sûrement. Pour comprendre, il faut savoir ce qui est « beaucoup » pour une tension, pour une intensité et pour une résistance.",en:"A taser delivers about 50,000 V. A wall socket only 230. Yet the socket is the surer killer. To understand, you need to know what counts as “a lot” for a voltage, a current and a resistance."}},
 {t:"order", q:{fr:"Touche ces objets dans l'ordre, de la plus petite tension à la plus grande.",en:"Tap these in order, from the smallest voltage to the largest."},
  o:[{fr:"Pile ronde",en:"Small round battery"},{fr:"Batterie de voiture",en:"Car battery"},{fr:"Prise de la maison",en:"Wall socket"},{fr:"Taser",en:"Taser"},{fr:"Éclair d'orage",en:"Lightning bolt"}],
  why:{fr:"Pile : 1,5 V. Batterie de voiture : 12 V. Prise : 230 V. Taser : environ 50 000 V. Éclair : jusqu'à 100 millions de volts.",en:"Round battery: 1.5 V. Car battery: 12 V. Socket: 230 V. Taser: about 50,000 V. Lightning: up to 100 million volts."}},
 {t:"mcq", q:{fr:"À partir de quelle tension le contact avec la peau sèche devient-il dangereux ?",en:"From what voltage does touching with dry skin become dangerous?"},
  o:[{fr:"Environ 50 V",en:"About 50 V"},{fr:"Environ 5 V",en:"About 5 V"},{fr:"Environ 1 000 V",en:"About 1,000 V"}],
  why:{fr:"En dessous, la tension ne pousse pas assez de courant à travers la peau : les piles sont sans danger. Avec la peau mouillée, la limite descend à 25 V. La prise, à 230 V, est très au-dessus.",en:"Below that, the voltage cannot push enough current through skin: batteries are safe. With wet skin the limit drops to 25 V. The socket, at 230 V, is far above."}},
 {t:"info", title:{fr:"Ce que le corps ressent",en:"What the body feels"},
  body:{fr:"Ce qui blesse, c'est le courant qui traverse le corps. À 1 mA (soit 0,001 A), un picotement. À 10 mA (soit 0,01 A), les muscles se crispent : impossible de lâcher. À 30 mA (soit 0,03 A), la respiration se bloque. À partir de 75 mA (soit 0,075 A), le cœur se dérègle : c'est mortel. Un seul ampère, c'est donc énorme pour un corps, alors qu'une bouilloire en utilise 9 sans problème.",en:"What injures is the current through the body. At 1 mA (that is 0.001 A), a tingle. At 10 mA (that is 0.01 A), muscles lock: you cannot let go. At 30 mA (that is 0.03 A), breathing stops. From 75 mA (that is 0.075 A), the heart loses its rhythm: it is fatal. A single ampere is therefore huge for a body, while a kettle happily uses 9."}},
 {t:"match", q:{fr:"Quel courant dans le corps produit quel effet ?",en:"Which current through the body causes which effect?"},
  p:[[{fr:"1 mA (soit 0,001 A)",en:"1 mA (that is 0.001 A)"},{fr:"léger picotement",en:"slight tingle"}],[{fr:"10 mA (soit 0,01 A)",en:"10 mA (that is 0.01 A)"},{fr:"muscles crispés, impossible de lâcher",en:"muscles lock, cannot let go"}],[{fr:"30 mA (soit 0,03 A)",en:"30 mA (that is 0.03 A)"},{fr:"respiration bloquée",en:"breathing stops"}],[{fr:"75 mA (soit 0,075 A)",en:"75 mA (that is 0.075 A)"},{fr:"cœur déréglé, danger de mort",en:"heart disrupted, risk of death"}]],
  why:{fr:"Tout se joue en milliampères : mille fois moins que ce qu'utilise un grille-pain.",en:"It all happens in milliamperes: a thousand times less than a toaster uses."}},
 {t:"mcq", q:{fr:"Dans le tableau électrique de la maison, un appareil coupe tout dès que 30 mA (soit 0,03 A) « fuient » hors du circuit, par exemple à travers une personne. Pourquoi 30 mA ?",en:"In the home's fuse box, a device cuts everything as soon as 30 mA (that is 0.03 A) “leaks” out of the circuit, for example through a person. Why 30 mA?"},
  o:[{fr:"C'est le seuil où le courant commence à mettre la vie en danger",en:"It is the threshold where current starts to endanger life"},{fr:"C'est le courant d'une ampoule",en:"It is the current of a light bulb"},{fr:"En dessous, on ne sent rien du tout",en:"Below that you feel nothing at all"}],
  why:{fr:"C'est le disjoncteur différentiel. Il coupe en une fraction de seconde, avant que la respiration ou le cœur ne soient touchés.",en:"This is the residual-current breaker. It cuts in a fraction of a second, before breathing or the heart are affected."}},
 {t:"num", fig:{top:[Rs("R = 100 Ω")],bot:[Am("?")],g:"3 V",flow:1}, q:{fr:"Comme en TP : une pile de 3 V et un résistor de 100 Ω. Quelle est l'intensité du courant dans le circuit ?",en:"Like in the lab: a 3 V battery and a 100 Ω resistor. What is the current in the circuit?"}, ans:0.03, unit:"A",
  why:{fr:"I = U ÷ R = 3 ÷ 100 = 0,03 A, soit 30 mA. Tiens, c'est justement le seuil où la respiration se bloque…",en:"I = U ÷ R = 3 ÷ 100 = 0.03 A, that is 30 mA. Hang on, that is exactly the threshold where breathing stops…"}},
 {t:"mcq", nb:1, fig:{top:[Rs("R = 100 Ω")],bot:[Am({fr:"0,03 A",en:"0.03 A"})],g:"3 V",flow:1}, q:{fr:"30 mA (soit 0,03 A) circulent dans ce circuit de TP. Pourquoi peux-tu le manipuler sans danger ?",en:"30 mA (that is 0.03 A) flows in this lab circuit. Why can you handle it safely?"},
  o:[{fr:"Ce courant circule dans le résistor, pas dans ton corps",en:"That current flows in the resistor, not in your body"},{fr:"Parce que 30 mA (soit 0,03 A) n'est jamais dangereux",en:"Because 30 mA (that is 0.03 A) is never dangerous"},{fr:"Parce que les fils sont en plastique",en:"Because the wires are made of plastic"}],
  why:{fr:"Les seuils de danger concernent le courant qui traverse le corps. Ici, le courant suit sa boucle : pile, fils, résistor. Pour qu'il passe par toi, il faudrait que la pile de 3 V arrive à le pousser à travers ta peau.",en:"The danger thresholds are about current through the body. Here the current follows its loop: battery, wires, resistor. To go through you, the 3 V battery would have to push it through your skin."}},
 {t:"mcq", q:{fr:"Et si tu touches les deux bornes de la pile de 3 V ? Ta peau sèche fait environ 100 000 Ω. L'intensité dans ton corps vaudrait…",en:"And if you touch both terminals of the 3 V battery? Your dry skin is about 100,000 Ω. The current in your body would be…"},
  o:[{fr:"0,00003 A : mille fois moins que 30 mA, tu ne sens rien",en:"0.00003 A: a thousand times less than 30 mA, you feel nothing"},{fr:"0,03 A, comme dans le résistor",en:"0.03 A, as in the resistor"},{fr:"3 A",en:"3 A"}],
  why:{fr:"I = U ÷ R = 3 ÷ 100 000 = 0,00003 A. Une petite tension ne peut pas pousser un courant dangereux à travers la grande résistance du corps. C'est pour cela qu'on travaille avec des piles en TP, jamais avec la prise.",en:"I = U ÷ R = 3 ÷ 100,000 = 0.00003 A. A small voltage cannot push a dangerous current through the body's large resistance. That is why lab work uses batteries, never the mains."}},
 {t:"order", q:{fr:"Touche-les dans l'ordre, de la plus petite intensité à la plus grande.",en:"Tap them in order, from the smallest current to the largest."},
  o:[{fr:"Petit voyant lumineux",en:"Small indicator light"},{fr:"Chargeur de téléphone",en:"Phone charger"},{fr:"Bouilloire",en:"Kettle"},{fr:"Démarreur de voiture",en:"Car starter motor"},{fr:"Éclair d'orage",en:"Lightning bolt"}],
  why:{fr:"Voyant : 0,02 A. Chargeur : 2 A. Bouilloire : 9 A. Démarreur : environ 200 A. Éclair : environ 30 000 A.",en:"Indicator: 0.02 A. Charger: 2 A. Kettle: 9 A. Starter: about 200 A. Lightning: about 30,000 A."}},
 {t:"mcq", q:{fr:"Un taser envoie environ 50 000 V. Pourquoi est-il conçu pour ne pas tuer, alors qu'une prise de 230 V le peut ?",en:"A taser delivers about 50,000 V. Why is it designed not to kill, when a 230 V socket can?"},
  o:[{fr:"Il ne fait passer que quelques milliampères, par impulsions très brèves",en:"It only drives a few milliamperes, in very brief pulses"},{fr:"Parce que 50 000 V, ce n'est pas beaucoup",en:"Because 50,000 V is not much"},{fr:"Parce que ses électrons sont plus lents",en:"Because its electrons are slower"}],
  why:{fr:"Il fait très mal et bloque les muscles, mais son courant est limité. La prise, elle, peut fournir un courant bien plus grand, aussi longtemps que dure le contact. C'est le courant et sa durée qui font le danger.",en:"It hurts a lot and locks the muscles, but its current is limited. The socket can supply a far larger current for as long as contact lasts. Current and duration make the danger."}},
 {t:"order", q:{fr:"Touche-les dans l'ordre, de la plus petite résistance à la plus grande.",en:"Tap them in order, from the smallest resistance to the largest."},
  o:[{fr:"Un mètre de fil de cuivre",en:"One metre of copper wire"},{fr:"Le filament d'une lampe de poche",en:"A torch bulb filament"},{fr:"Le corps humain, peau sèche",en:"The human body, dry skin"},{fr:"La gaine en plastique du fil",en:"The wire's plastic coating"}],
  why:{fr:"Fil : environ 0,01 Ω, presque rien. Filament : environ 15 Ω. Corps, peau sèche : environ 100 000 Ω. Plastique : des milliards d'ohms, c'est un isolant.",en:"Wire: about 0.01 Ω, almost nothing. Filament: about 15 Ω. Body, dry skin: about 100,000 Ω. Plastic: billions of ohms, it is an insulator."}},
 {t:"num", q:{fr:"Avec la peau mouillée, le corps ne fait plus qu'environ 1 000 Ω. Quelqu'un touche le 230 V. D'après la loi d'Ohm, quelle intensité le traverse ?",en:"With wet skin, the body is only about 1,000 Ω. Someone touches 230 V. By Ohm's law, what current goes through them?"}, ans:0.23, unit:"A",
  why:{fr:"I = U ÷ R = 230 ÷ 1 000 = 0,23 A, soit 230 mA : trois fois le seuil mortel. Voilà pourquoi on ne touche jamais un appareil électrique les mains mouillées.",en:"I = U ÷ R = 230 ÷ 1,000 = 0.23 A, that is 230 mA: three times the fatal threshold. That is why you never touch an electrical appliance with wet hands."}},
 {t:"mcq", q:{fr:"Avec la peau bien sèche (100 000 Ω), le même calcul donne 2,3 mA (soit 0,0023 A). Que ressentirait-on ?",en:"With very dry skin (100,000 Ω), the same calculation gives 2.3 mA (that is 0.0023 A). What would you feel?"},
  o:[{fr:"Un picotement désagréable",en:"An unpleasant tingle"},{fr:"Rien du tout",en:"Nothing at all"},{fr:"Un arrêt du cœur",en:"Cardiac arrest"}],
  why:{fr:"Même tension, cent fois moins de courant : tout dépend de la résistance. Mais la peau n'est jamais parfaitement sèche, et personne ne connaît sa résistance du moment : on ne teste jamais.",en:"Same voltage, a hundred times less current: it all depends on resistance. But skin is never perfectly dry, and nobody knows their resistance at a given moment: never test it."}}
]},
{id:"cc", title:{fr:"Le court-circuit",en:"The short circuit"}, sub:{fr:"Quand plus rien ne freine le courant",en:"When nothing slows the current any more"}, steps:[
 {t:"info", fig:{flow:1,fast:1,g:{fr:"4,5 V",en:"4.5 V"},i:{fr:"courant énorme",en:"huge current"}}, title:{fr:"Un fil, une pile, et rien d'autre",en:"A wire, a battery, and nothing else"},
  body:{fr:"Relie les deux bornes d'une pile par un simple fil : en quelques secondes le fil devient brûlant et la pile se vide. Rien ne freine les électrons, le courant devient énorme. C'est un court-circuit, et c'est la cause de nombreux incendies. À ne pas essayer.",en:"Join the two terminals of a battery with a plain wire: within seconds the wire is burning hot and the battery is drained. Nothing slows the electrons, the current becomes huge. That is a short circuit, and it causes many house fires. Do not try it."}},
 {t:"info", title:{fr:"Il faut dépenser l'énergie",en:"The energy has to be spent"},
  body:{fr:"Une lampe, un moteur, un résistor : tous ont une résistance. Tous freinent donc le courant, et tous chauffent, car une résistance chauffe toujours. Chacun transforme l'énergie électrique à sa façon : la lampe en lumière et en chaleur, le moteur en mouvement et en chaleur, le résistor en chaleur seulement. Dans chaque boucle, il faut au moins un dipôle qui dépense ainsi l'énergie de la pile. Sinon, c'est le court-circuit.",en:"A lamp, a motor, a resistor: all have a resistance. So all of them slow the current, and all of them heat up, because a resistance always heats. Each converts electrical energy in its own way: the lamp into light and heat, the motor into motion and heat, the resistor into heat only. Every loop needs at least one component that spends the battery's energy like this. Otherwise, it is a short circuit."}},
 {t:"mcq", q:{fr:"Qu'est-ce qu'un court-circuit ?",en:"What is a short circuit?"},
  o:[{fr:"Les deux bornes de la pile reliées par un fil, sans aucun dipôle pour freiner le courant",en:"The two battery terminals joined by a wire, with no component to slow the current"},{fr:"Un circuit avec des fils très courts",en:"A circuit with very short wires"},{fr:"Un circuit dont l'interrupteur est ouvert",en:"A circuit whose switch is open"}],

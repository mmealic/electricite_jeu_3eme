  why:{fr:"Le courant prend un chemin presque sans résistance. Un interrupteur ouvert, c'est l'inverse : plus de courant du tout.",en:"The current takes a path with almost no resistance. An open switch is the opposite: no current at all."}},
 {t:"mcq", q:{fr:"Une pile de 4,5 V alimente une lampe de 15 Ω : l'intensité vaut 0,3 A. On remplace la lampe par un fil de 0,1 Ω. D'après la loi d'Ohm, l'intensité devrait valoir…",en:"A 4.5 V battery feeds a 15 Ω lamp: the current is 0.3 A. The lamp is replaced by a 0.1 Ω wire. According to Ohm's law, the current should be…"},
  o:["45 A",{fr:"0,45 A",en:"0.45 A"},{fr:"0,3 A",en:"0.3 A"}],
  why:{fr:"I = U ÷ R = 4,5 ÷ 0,1 = 45 A, soit 150 fois plus. En réalité la pile ne peut pas fournir autant : elle chauffe et s'abîme en essayant.",en:"I = U ÷ R = 4.5 ÷ 0.1 = 45 A, 150 times more. In reality the battery cannot supply that much: it overheats and is damaged trying."}},
 {t:"mcq", q:{fr:"Pourquoi un court-circuit est-il dangereux ?",en:"Why is a short circuit dangerous?"},
  o:[{fr:"L'intensité devient très grande : les fils chauffent et peuvent provoquer un incendie",en:"The current becomes very large: the wires heat up and can start a fire"},{fr:"La tension devient très grande",en:"The voltage becomes very large"},{fr:"Les lampes brillent trop fort",en:"The lamps shine too brightly"}],
  why:{fr:"La tension de la pile ne change pas. C'est le courant qui s'emballe, et même un fil a une toute petite résistance qui chauffe.",en:"The battery's voltage does not change. It is the current that runs away, and even a wire has a tiny resistance that heats up."}},
 {t:"match", q:{fr:"En quoi chaque dipôle transforme-t-il l'énergie électrique ?",en:"What does each component turn electrical energy into?"},
  p:[[{fr:"Lampe",en:"Lamp"},{fr:"lumière et chaleur",en:"light and heat"}],[{fr:"Moteur",en:"Motor"},{fr:"mouvement et chaleur",en:"motion and heat"}],[{fr:"Résistor",en:"Resistor"},{fr:"chaleur seulement",en:"heat only"}],[{fr:"Fil seul",en:"Wire alone"},{fr:"presque rien : court-circuit",en:"almost nothing: short circuit"}]],
  why:{fr:"La chaleur est partout : dès qu'il y a une résistance, les collisions des électrons avec les atomes chauffent le dipôle.",en:"Heat is everywhere: wherever there is resistance, the electrons' collisions with atoms heat the component."}},
 {t:"mcq", q:{fr:"Une lampe a-t-elle une résistance ?",en:"Does a lamp have a resistance?"},
  o:[{fr:"Oui : son filament freine le courant et chauffe jusqu'à briller",en:"Yes: its filament slows the current and heats up until it glows"},{fr:"Non, seuls les résistors en ont une",en:"No, only resistors have one"},{fr:"Seulement quand elle est éteinte",en:"Only when it is off"}],
  why:{fr:"C'est pour cela qu'une lampe suffit à protéger la pile : elle limite le courant.",en:"That is why one lamp is enough to protect the battery: it limits the current."}},
 {t:"info", fig:{br:[[Rs("R₁","10 Ω")],[Rs("R₂","30 Ω")]],g:"6 V",flow:1,w:[3,1]}, title:{fr:"Le chemin le plus facile",en:"The easiest path"},
  body:{fr:"Au nœud, le courant se partage, mais pas à égalité : la branche qui résiste le moins en reçoit le plus. Regarde les points : ils sont plus rapides dans la branche de R₁. Si une branche n'a presque aucune résistance, elle prend presque tout le courant. C'est exactement ce qui se passe dans un court-circuit.",en:"At the node the current splits, but not equally: the branch that resists least gets the most. Watch the dots: they move faster in the branch of R₁. If a branch has almost no resistance, it takes almost all the current. That is exactly what happens in a short circuit."}},
 {t:"mcq", fig:{br:[[Rs("R₁","10 Ω")],[Rs("R₂","30 Ω")]],g:"6 V"}, q:{fr:"Dans quelle branche l'intensité du courant est-elle la plus grande ?",en:"In which branch is the current largest?"},
  o:[{fr:"Celle de R₁, la moins résistante",en:"That of R₁, the least resistant"},{fr:"Celle de R₂, la plus résistante",en:"That of R₂, the most resistant"},{fr:"C'est la même dans les deux",en:"It is the same in both"}],
  why:{fr:"Les deux branches ont la même tension, 6 V. Avec I = U ÷ R, moins de résistance donne plus de courant.",en:"Both branches have the same voltage, 6 V. With I = U ÷ R, less resistance gives more current."}},
 {t:"num", fig:{br:[[Rs("R₁","10 Ω")],[Rs("R₂","30 Ω")]],g:"6 V",flow:1,w:[3,1]}, q:{fr:"La branche de R₁ est parcourue par 0,6 A. Calcule l'intensité dans la branche de R₂.",en:"The branch of R₁ carries 0.6 A. Calculate the current in the branch of R₂."}, ans:0.2, unit:"A",
  why:{fr:"I₂ = U ÷ R₂ = 6 ÷ 30 = 0,2 A. Trois fois plus de résistance, trois fois moins de courant.",en:"I₂ = U ÷ R₂ = 6 ÷ 30 = 0.2 A. Three times the resistance, a third of the current."}},
 {t:"mcq", fig:{br:[[Lp("L")],[]],short:1,flow:1,g:{fr:"4,5 V",en:"4.5 V"}}, q:{fr:"On ajoute un fil en dérivation aux bornes de la lampe. Que se passe-t-il ?",en:"A wire is added in parallel across the lamp. What happens?"},
  o:[{fr:"La lampe s'éteint et la pile est en court-circuit",en:"The lamp goes out and the battery is short-circuited"},{fr:"La lampe brille plus fort",en:"The lamp shines brighter"},{fr:"Rien ne change",en:"Nothing changes"}],
  why:{fr:"Le fil est une branche presque sans résistance : c'est le chemin le plus facile. Presque tout le courant passe par là, plus rien ne le limite, et il devient énorme.",en:"The wire is a branch with almost no resistance: it is the easiest path. Almost all the current goes that way, nothing limits it any more, and it becomes huge."}},
 {t:"mcq", q:{fr:"Un ampèremètre ne doit pas freiner le courant qu'il mesure. Sa résistance est donc…",en:"An ammeter must not slow the current it measures. So its resistance is…"},
  o:[{fr:"Presque nulle",en:"Almost zero"},{fr:"Très grande",en:"Very large"},{fr:"Égale à celle d'une lampe",en:"Equal to a lamp's"}],
  why:{fr:"Pour le circuit, un ampèremètre est comme un simple fil. En série, il ne change rien au courant. Mais branché seul aux bornes de la pile ou d'une lampe, il devient le chemin le plus facile : court-circuit, et son fusible grille.",en:"To the circuit, an ammeter is like a plain wire. In series, it does not change the current. But connected alone across the battery or a lamp, it becomes the easiest path: short circuit, and its fuse blows."}},
 {t:"mcq", q:{fr:"Comment éviter un court-circuit ?",en:"How do you avoid a short circuit?"},
  o:[{fr:"Chaque boucle reliée à la pile doit contenir au moins un dipôle qui a une résistance",en:"Every loop connected to the battery must contain at least one component with a resistance"},{fr:"En utilisant des fils plus gros",en:"By using thicker wires"},{fr:"En ajoutant une deuxième pile",en:"By adding a second battery"}],
  why:{fr:"Lampe, moteur ou résistor : il faut quelque chose qui dépense l'énergie et limite le courant.",en:"Lamp, motor or resistor: something has to spend the energy and limit the current."}},
 {t:"mcq", q:{fr:"À la maison, qu'est-ce qui coupe le courant en cas de court-circuit ?",en:"At home, what cuts the current when there is a short circuit?"},
  o:[{fr:"Le disjoncteur ou le fusible",en:"The circuit breaker or the fuse"},{fr:"L'interrupteur de la lampe",en:"The lamp's switch"},{fr:"La prise",en:"The socket"}],
  why:{fr:"Dès que l'intensité dépasse la limite, il ouvre le circuit avant que les fils ne chauffent trop.",en:"As soon as the current exceeds the limit, it opens the circuit before the wires get too hot."}}
]},
{id:"doc", title:{fr:"Lire un document",en:"Reading a document"}, sub:{fr:"Trouver les bonnes informations dans un texte",en:"Finding the right information in a text"}, steps:[
 {t:"info", doc:DOC, title:{fr:"Lis d'abord, calcule ensuite",en:"Read first, calculate after"},
  body:{fr:"Au contrôle, les données sont souvent cachées dans un texte, au milieu d'informations inutiles. Lis celui-ci calmement. Il restera affiché au-dessus de chaque question.",
        en:"In a test, the data is often hidden in a text, among useless information. Read this one calmly. It stays on screen above every question."}},
 {t:"mcq", doc:DOC, q:{fr:"Quelles informations du texte ne servent à rien pour étudier le circuit ?",en:"Which information in the text is useless for studying the circuit?"},
  o:[{fr:"La longueur et le prix",en:"The length and the price"},{fr:"La tension de la pile",en:"The battery voltage"},{fr:"Le type de branchement",en:"The type of connection"}],
  why:{fr:"2 mètres et 7,90 € ne sont pas des grandeurs électriques. Savoir trier, c'est déjà la moitié du travail.",en:"2 metres and €7.90 are not electrical quantities. Sorting is already half the job."}},
 {t:"mcq", doc:DOC, q:{fr:"Dans le texte, à quelle grandeur correspond « 20 mA (soit 0,02 A) » ?",en:"In the text, which quantity does “20 mA (that is 0.02 A)” refer to?"},
  o:[{fr:"L'intensité du courant dans la branche de chaque lampe",en:"The current in each lamp's branch"},{fr:"La tension aux bornes de chaque lampe",en:"The voltage across each lamp"},{fr:"L'intensité qui sort de la pile",en:"The current leaving the battery"}],
  why:{fr:"mA comme milliampère : c'est une intensité. Et le texte précise « dans chaque lampe ».",en:"mA for milliampere: it is a current. And the text says “in each lamp”."}},
 {t:"num", doc:DOC, q:{fr:"Quelle est la tension aux bornes de chaque lampe ?",en:"What is the voltage across each lamp?"}, ans:4.5, unit:"V",
  why:{fr:"Le mot à repérer est « dérivation » : chaque lampe a la même tension que la pile.",en:"The word to spot is “parallel”: each lamp has the same voltage as the battery."}},
 {t:"num", doc:DOC, q:{fr:"Avant la panne, quelle intensité sortait de la pile ?",en:"Before the lamp blew, what current left the battery?"}, ans:200, unit:"mA",
  why:{fr:"10 branches à 20 mA (soit 0,02 A) chacune : les intensités s'additionnent, 10 × 20 = 200 mA (soit 0,2 A).",en:"10 branches at 20 mA (that is 0.02 A) each: currents add up, 10 × 20 = 200 mA (that is 0.2 A)."}},
 {t:"mcq", doc:DOC, q:{fr:"Quand une lampe grille, que font les neuf autres ?",en:"When one lamp blows, what do the other nine do?"},
  o:[{fr:"Elles restent allumées",en:"They stay on"},{fr:"Elles s'éteignent toutes",en:"They all go out"},{fr:"Elles brillent deux fois moins",en:"They shine half as bright"}],
  why:{fr:"En dérivation, chaque lampe a sa propre boucle avec la pile.",en:"In parallel, each lamp has its own loop with the battery."}},
 {t:"mcq", doc:DOC, q:{fr:"L'ampèremètre affiche 180 mA (soit 0,18 A) après la panne. Est-ce logique ?",en:"The ammeter reads 180 mA (that is 0.18 A) after the lamp blew. Does that make sense?"},
  o:[{fr:"Oui : il reste 9 branches, 9 × 20 = 180 mA (soit 0,18 A)",en:"Yes: 9 branches remain, 9 × 20 = 180 mA (that is 0.18 A)"},{fr:"Non, il devrait afficher 200 mA (soit 0,2 A)",en:"No, it should read 200 mA (that is 0.2 A)"},{fr:"Non, il devrait afficher 20 mA (soit 0,02 A)",en:"No, it should read 20 mA (that is 0.02 A)"}],
  why:{fr:"Une branche en moins, 20 mA (soit 0,02 A) en moins dans la branche principale.",en:"One branch fewer, 20 mA (that is 0.02 A) less in the main branch."}},
 {t:"mcq", doc:DOC, q:{fr:"Où Inès a-t-elle placé l'ampèremètre, et comment ?",en:"Where did Inès put the ammeter, and how?"},
  o:[{fr:"Dans la branche principale, en série",en:"In the main branch, in series"},{fr:"Aux bornes de la pile, en dérivation",en:"Across the battery, in parallel"},{fr:"Aux bornes d'une lampe",en:"Across a lamp"}],
  why:{fr:"« Juste à la sortie de la pile » : c'est la branche principale. Et un ampèremètre se place toujours sur le chemin du courant.",en:"“Right next to the battery”: that is the main branch. And an ammeter always sits in the path of the current."}}
]}
];

 days:{fr:"jours d'affilée",en:"day streak"}, numHint:{fr:"Ta réponse",en:"Your answer"},
 r3:{fr:"Lampe allumée, sans une erreur",en:"Lamp lit, not a single mistake"}, r2:{fr:"Lampe allumée",en:"Lamp lit"}, r1:{fr:"Lampe allumée, de justesse",en:"Lamp lit, just about"},
 err:{fr:"erreur(s)",en:"mistake(s)"},
 praise:[{fr:"Exact !",en:"Correct!"},{fr:"Bien vu !",en:"Well spotted!"},{fr:"Le courant passe !",en:"The current flows!"}]
};
const MLAB=[{fr:"Molette (sélecteur)",en:"Dial (selector)"},{fr:"Bornes utilisées",en:"Sockets used"},{fr:"Branchement",en:"Connection"}];
const MDIAL=[{v:"V",l:"V"},{v:"A",l:"A"},{v:"O",l:"Ω"},{v:"OFF",l:"OFF"}];
const MSOCK=[{v:"V",l:{fr:"COM et VΩ",en:"COM and VΩ"}},{v:"A",l:{fr:"COM et A",en:"COM and A"}}];
const mrows=s=>[MDIAL,MSOCK,s.w||WSP];

/* ================================ engine ================================ */
const app=document.getElementById("app"), KEY="voltio-v1";
const $=s=>app.querySelector(s), $$=s=>app.querySelectorAll(s);
let S={xp:0,stars:{},streak:0,last:"",lang:"fr"}, L=null;
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
S.lang="fr";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const T=x=>x==null?"":(typeof x==="string"?x:(x[S.lang]!=null?x[S.lang]:x.fr));
const fmt=n=>S.lang==="fr"?String(n).replace(".",","):String(n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const LAMP='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27"/><path d="M13 13l38 38M51 13L13 51"/></svg>';

function home(){
  L=null; document.documentElement.lang=S.lang;
  const row=(id,title,sub)=>{const st=S.stars[id]||0;
    return `<li><button class="node ${st?"lit":""}" data-id="${id}"><span class="lamp">${LAMP}</span><span class="nt"><strong>${title}</strong><span>${sub}</span><span class="stars" aria-label="${st}/3">${"★".repeat(st)}${"☆".repeat(3-st)}</span></span></button></li>`;};
  app.innerHTML=`<div class="home">
    <header class="top"><span class="logo">Voltio</span>
      <span class="stat" title="${T(UI.days)}">🔥 ${S.streak}</span><span class="stat">⚡ ${S.xp} XP</span></header>
    <h1>${T(UI.h1)}</h1><p class="intro">${T(UI.intro)}</p>
    <button class="lang cls" id="cls">${S.cls?"Mode classe activé : réponses A, B, C, D":"Activer le mode classe (réponses A, B, C, D)"}</button>
    <ul class="path">${U.map(u=>row(u.id,T(u.title),T(u.sub))).join("")}${row("boss",T(UI.boss),T(UI.bossSub))}</ul>
    <button class="reset" id="reset">${T(UI.reset)}</button></div>`;
  $$(".node").forEach(b=>b.onclick=()=>start(b.dataset.id));
  $("#cls").onclick=()=>{S.cls=!S.cls; save(); home();};
  const r=$("#reset"); r.onclick=()=>{ if(r.dataset.sure){S.xp=0;S.stars={};S.streak=0;S.last="";save();home();} else {r.dataset.sure=1; r.textContent=T(UI.sure);} };
  window.scrollTo(0,0);
}

function start(id){
  const steps=id==="boss" ? shuffle(U.flatMap(u=>u.steps).filter(s=>s.t!=="info"&&!s.nb)).slice(0,10) : U.find(u=>u.id===id).steps;
  L={id,queue:steps.slice(),total:steps.length,done:0,mistakes:0,again:new Set()};
  next();
}
function next(){ if(!L.queue.length) return finish(); L.cur=L.queue.shift(); L.sel=null; L.locked=false; L.m=[null,null,null]; render(); }

function render(){
  const s=L.cur, pct=Math.round(100*L.done/L.total);
  let body=L.again.has(s)?`<span class="chip">${T(UI.again)}</span>`:"";
  if(s.doc) body+=`<div class="doc">${T(s.doc)}</div>`;
  let foot=`<button class="btn" id="go" disabled>${T(UI.check)}</button>`;
  if(s.t==="info"){ body+=`<h2>${T(s.title)}</h2>${fig(s.fig,s.fig&&s.fig.play?"play":"")}<p class="lead">${T(s.body)}</p>`; foot=`<button class="btn" id="go">${T(UI.cont)}</button>`; }
  else{
    body+=`<h2>${T(s.q)}</h2>${fig(s.fig)}`;
    if(s.t==="mcq"){ const list=s.of||s.o;
      L.ltr={}; L.vote=(L.vote||0)+1; if(S.cls) body=`<span class="chip vote">Vote n° ${L.vote} : A, B, C ou D</span><br>`+body;
      body+=`<div class="opts">${shuffle(list.map((_,i)=>i)).map((i,k)=>{ L.ltr[i]="ABCD"[k]; const tag=S.cls?`<span class="rk">${"ABCD"[k]}</span>`:"";
        return s.of?`<button class="opt figopt" data-i="${i}">${tag}${figSVG(s.of[i])}</button>`:`<button class="opt" data-i="${i}">${tag}${T(s.o[i])}</button>`; }).join("")}</div>`; }
    if(s.t==="order"){ let o; do{ o=shuffle(s.o.map((_,i)=>i)); }while(o.every((v,k)=>v===k));
      body+=`<div class="opts" id="ord">${o.map(i=>`<button class="opt" data-i="${i}"><span class="rk"></span>${T(s.o[i])}</button>`).join("")}</div>`; }
    if(s.t==="num") body+=`<div class="num"><input id="ni" inputmode="decimal" autocomplete="off" aria-label="${T(UI.numHint)}" placeholder="${T(UI.numHint)}"><span>${s.unit}</span></div>`;
    if(s.t==="match"){
      const idx=s.p.map((_,i)=>i), l=shuffle(idx); let r; do{ r=shuffle(idx); }while(r.some((v,k)=>v===l[k]));
      body+=`<div class="cols">${l.map((li,k)=>`<button class="opt" data-side="l" data-i="${li}">${T(s.p[li][0])}</button><button class="opt" data-side="r" data-i="${r[k]}">${T(s.p[r[k]][1])}</button>`).join("")}</div>`;
      foot=`<p class="hint">${T(UI.pairs)}</p>`; L.mt={l:null,r:null,left:s.p.length,miss:0};
    }
    if(s.t==="place"){ L.pl=null; body+=`<div class="fig" id="pfig">${placeSVG(s.kind,null,false)}</div><div class="tray"><button class="token" id="tok" aria-label="${s.kind}">${s.kind}</button><span>${T(UI.drag)}</span></div>`; }
    if(s.t==="table") body+=`<div class="fig" id="tfig">${figSVG(tfig(s,0))}</div><p class="pick">${T(UI.pick)}</p><div class="seg" id="upick">${s.us.map(u=>`<button class="opt" data-u="${u}">${fmt(u)} V</button>`).join("")}</div>
      <table class="tbl"><tr><th>U (V)</th><th>I (A)</th><th>U ÷ I</th></tr>${s.us.map(u=>`<tr data-u="${u}"><td>…</td><td>…</td><td><input inputmode="decimal" autocomplete="off" disabled aria-label="U ÷ I"></td></tr>`).join("")}</table>`;
    if(s.t==="meter") body+=`<div class="mwrap"><div id="msvg">${meterSVG(L.m)}</div><div>${mrows(s).map((row,k)=>`<div class="mrow"><p>${T(MLAB[k])}</p><div class="seg">${(k===2?shuffle(row):row).map(o=>`<button class="opt" data-k="${k}" data-v="${o.v}">${T(o.l)}</button>`).join("")}</div></div>`).join("")}</div></div>`;
  }
  app.innerHTML=`<div class="lesson"><div class="bar"><button class="x" id="quit" aria-label="${T(UI.quit)}">✕</button>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div></div>
    <main class="step">${body}</main><footer class="foot" id="foot">${foot}</footer></div>`;
  $("#quit").onclick=home;
  const go=$("#go");
  if(go) go.onclick=()=>{ if(s.t==="info"){L.done++; next();} else check(); };
  if(s.t==="mcq") $$(".opt").forEach(b=>b.onclick=()=>{ if(L.locked) return; L.sel=+b.dataset.i; $$(".opt").forEach(x=>x.classList.toggle("sel",x===b)); go.disabled=false; });
  if(s.t==="num"){ const ni=$("#ni"); ni.oninput=()=>{go.disabled=!ni.value.trim();}; ni.onkeydown=e=>{ if(e.key==="Enter"&&!go.disabled&&!L.locked) check(); }; if(!s.doc) ni.focus(); }
  if(s.t==="info"&&s.fig&&s.fig.play){ const fg=JSON.parse(JSON.stringify(s.fig)), box=$("#play");
    box.onclick=e=>{ const t=e.target.closest("[data-p]"); if(!t) return; const p=t.dataset.p.split("."); let c=fg[p[0]][+p[1]]; if(p.length===3) c=c[+p[2]]; c.on=c.on===false; box.innerHTML=figSVG(fg); }; }
  if(s.t==="place"){ const pf=$("#pfig"), tok=$("#tok");
    const set=z=>{ if(L.locked) return; L.pl=z; pf.innerHTML=placeSVG(s.kind,z,false); tok.style.visibility="hidden"; go.disabled=false; };
    pf.onclick=e=>{ const z=e.target.closest(".zone"); if(z) set(z.dataset.z); };
    tok.onpointerdown=e=>{ if(L.locked) return; e.preventDefault(); const sx=e.clientX, sy=e.clientY; try{tok.setPointerCapture(e.pointerId);}catch(_){ } tok.classList.add("drag");
      tok.onpointermove=ev=>{ tok.style.transform=`translate(${ev.clientX-sx}px,${ev.clientY-sy}px)`; };
      tok.onpointerup=tok.onpointercancel=ev=>{ tok.onpointermove=tok.onpointerup=tok.onpointercancel=null; tok.style.transform=""; tok.classList.remove("drag");
        let best=null, bd=1e9; pf.querySelectorAll(".zone").forEach(z=>{ const b=z.getBoundingClientRect(), d=Math.hypot(ev.clientX-b.left-b.width/2, ev.clientY-b.top-b.height/2); if(d<bd){bd=d; best=z.dataset.z;} });
        if(best&&bd<70) set(best); }; }; }
  if(s.t==="table"){ $$("#upick .opt").forEach(b=>b.onclick=()=>{ if(L.locked) return; const u=+b.dataset.u; $$("#upick .opt").forEach(x=>x.classList.toggle("sel",x===b)); $("#tfig").innerHTML=figSVG(tfig(s,u));
      const tr=$(`.tbl tr[data-u="${u}"]`); tr.children[0].textContent=fmt(u); tr.children[1].textContent=fmt((u/s.R).toFixed(2)); tr.querySelector("input").disabled=false; });
    $$(".tbl input").forEach(i=>i.oninput=()=>{ go.disabled=[...$$(".tbl input")].some(x=>!x.value.trim()); }); }
  if(s.t==="order"){ L.ord=[];
    $$("#ord .opt").forEach(b=>b.onclick=()=>{ if(L.locked) return; const i=+b.dataset.i, r=L.ord.indexOf(i); if(r>=0) L.ord=L.ord.slice(0,r); else L.ord.push(i);
      $$("#ord .opt").forEach(x=>{ const k=L.ord.indexOf(+x.dataset.i); x.classList.toggle("sel",k>=0); x.querySelector(".rk").textContent=k>=0?k+1:""; }); go.disabled=L.ord.length<s.o.length; }); }
  if(s.t==="match") $$(".cols .opt").forEach(b=>b.onclick=()=>matchTap(b));
  if(s.t==="meter") $$(".seg .opt").forEach(b=>b.onclick=()=>{ if(L.locked) return; const k=+b.dataset.k; L.m[k]=b.dataset.v;
    $$(`.seg .opt[data-k="${k}"]`).forEach(x=>x.classList.toggle("sel",x===b)); $("#msvg").innerHTML=meterSVG(L.m); go.disabled=L.m.includes(null); });
}

function matchTap(b){
  const m=L.mt, side=b.dataset.side;
  if(L.locked||b.classList.contains("good")) return;
  $$(`.cols .opt[data-side="${side}"]`).forEach(x=>x.classList.remove("sel"));
  b.classList.add("sel"); m[side]=b;
  if(m.l&&m.r){
    const a=m.l, c=m.r; m.l=m.r=null;
    if(a.dataset.i===c.dataset.i){ [a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("good");x.disabled=true;}); if(--m.left===0){ if(m.miss) L.mistakes++; feedback(true,""); } }
    else{ m.miss++; [a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("wrong");}); setTimeout(()=>[a,c].forEach(x=>x.classList.remove("wrong")),600); }
  }
}

function check(){
  const s=L.cur; let ok=false, corr="";
  if(s.t==="mcq"){ ok=L.sel===0; corr=(S.cls?L.ltr[0]+(s.of?"":" : "):"")+(s.of?"":T(s.o[0]));
    $$(".opt").forEach(b=>{const i=+b.dataset.i; b.disabled=true; b.classList.remove("sel"); if(i===0) b.classList.add("good"); else if(i===L.sel) b.classList.add("wrong");}); }
  if(s.t==="num"){ const ni=$("#ni"), v=parseFloat(ni.value.replace(",",".").replace(/[^0-9.\-]/g,""));
    ok=Math.abs(v-s.ans)<=Math.abs(s.ans)*0.011+1e-9; corr=fmt(s.ans)+" "+s.unit; ni.disabled=true; }
  if(s.t==="order"){ ok=L.ord.every((v,k)=>v===k); corr=s.o.map(T).join(" < ");
    $$("#ord .opt").forEach(b=>{ const i=+b.dataset.i; b.disabled=true; b.classList.remove("sel"); b.classList.add(L.ord[i]===i?"good":"wrong"); }); }
  if(s.t==="place"){ ok=L.pl===s.ans; $("#pfig").innerHTML=placeSVG(s.kind,L.pl,true); corr=T(WSP.find(o=>o.v===s.ans).l); }
  if(s.t==="table"){ ok=true; corr="U ÷ I = "+s.R; [...$$(".tbl input")].forEach(i=>{ const v=parseFloat(i.value.replace(",",".")), g=Math.abs(v-s.R)<=s.R*0.011; i.classList.add(g?"good":"wrong"); i.disabled=true; if(!g) ok=false; }); }
  if(s.t==="meter"){ ok=s.ans.every((v,i)=>L.m[i]===v); const rows=mrows(s);
    corr=s.ans.map((v,i)=>T(rows[i].find(o=>o.v===v).l)).join(", ");
    $$(".seg .opt").forEach(b=>{const k=+b.dataset.k; b.disabled=true; b.classList.remove("sel"); if(b.dataset.v===s.ans[k]) b.classList.add("good"); else if(b.dataset.v===L.m[k]) b.classList.add("wrong");}); }
  feedback(ok,corr);
}

function feedback(ok,corr){
  const s=L.cur, f=$("#foot"); L.locked=true;
  f.className="foot "+(ok?"ok":"bad");
  f.innerHTML=`<div class="fb" role="status"><strong>${ok?T(UI.praise[Math.floor(Math.random()*UI.praise.length)]):T(UI.nope)}</strong>
    ${!ok&&corr?`<p class="corr">${T(UI.answer)} ${corr}</p>`:""}<p>${T(s.why)}</p></div><button class="btn" id="go">${T(UI.cont)}</button>`;
  const go=$("#go");
  go.onclick=()=>{ if(ok) L.done++; else{ L.mistakes++; L.again.add(s); L.queue.push(s);} next(); };
  go.focus();
}

function finish(){
  const st=L.mistakes===0?3:L.mistakes<=2?2:1, gain=L.total*10+(st===3?20:0), id=L.id, mist=L.mistakes;
  S.xp+=gain; S.stars[id]=Math.max(S.stars[id]||0,st);
  const today=new Date().toDateString(), y=new Date(Date.now()-864e5).toDateString();
  if(S.last!==today){ S.streak=S.last===y?S.streak+1:1; S.last=today; }
  save(); L=null;
  app.innerHTML=`<div class="result"><div class="lamp lit">${LAMP}</div><h1>${T(UI["r"+st])}</h1>
    <div class="stars" aria-label="${st}/3">${"★".repeat(st)}${"☆".repeat(3-st)}</div>
    <p>+${gain} XP, ${mist} ${T(UI.err)}</p>
    <button class="btn" id="back">${T(UI.back)}</button><button class="btn ghost" id="redo">${T(UI.redo)}</button></div>`;
  $("#back").onclick=home; $("#redo").onclick=()=>start(id); $("#back").focus();
}

/* ============================== drawings ============================== */
const fig=(f,id)=>f?`<div class="fig"${id?` id="${id}"`:""}>${figSVG(f)}</div>`:"";
const ST='stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"';
const LIT="color-mix(in srgb,var(--volt) 60%,var(--card))", FC=["var(--red)","var(--accent)","var(--ok)"];
const PILE=`<rect x="28" y="110" width="24" height="10" fill="var(--card)"/><path d="M26 109h28" fill="none" ${ST}/><path d="M33 121h14" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><text x="16" y="106" text-anchor="middle" class="ft">+</text><text x="16" y="134" text-anchor="middle" class="ft">−</text>`;
const tfig=(s,u)=>({top:[{c:"res",n:"R",vm:"V",vl:u?fmt(u)+" V":""}],bot:[Am(u?fmt((u/s.R).toFixed(2))+" A":"")],g:u?fmt(u)+" V":"",flow:1,off:!u,spd:u?0.1/(u/s.R):1});
/* one coloured stream of dots per loop; i = loop index, k = number of loops, m = slow-down factor */
function flowPath(d,i,k,m){ const P=k>1?14*k:18, dur=1.1*P/18*(m||1);
  return `<path class="flow" d="${d}" style="--p:${P+.1};stroke:${FC[i%3]};stroke-dasharray:.1 ${P};animation-duration:${dur.toFixed(2)}s;animation-delay:-${(dur*i/Math.max(k,1)).toFixed(2)}s"/>`; }
function figSVG(f){
  const st=ST;
  const tx=(x,y,s,a)=>{s=T(s); return s?`<text x="${x}" y="${y}" text-anchor="${a||"middle"}" class="ft${s.includes("?")?" hl":""}">${s}</text>`:"";};
  const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="4.5" fill="currentColor"/>`;
  if(f.k==="atoms"){
    let g=`<rect x="10" y="14" width="300" height="84" rx="14" fill="none" ${st}/>`;
    for(let i=0;i<6;i++) for(const y of [38,74]) g+=`<circle cx="${45+i*46}" cy="${y}" r="11" fill="var(--line)" stroke="currentColor" stroke-width="2"/>`;
    g+=flowPath("M16 58L62 60L70 26L112 56L158 62L168 90L206 58L250 54L260 26L296 56",0,1,1.6);
    g+=`<path d="M16 58L62 60L70 26L112 56L158 62L168 90L206 58L250 54L260 26L296 56" fill="none" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="4 5" stroke-linejoin="round" opacity=".6"/><path d="M288 49L300 57L287 62Z" fill="var(--red)"/>`;
    g+=tx(91,118,{fr:"atomes du métal",en:"metal atoms"})+`<text x="250" y="118" text-anchor="middle" class="ft hl">${T({fr:"trajet d'un électron",en:"path of one electron"})}</text>`;
    return `<svg viewBox="0 0 320 126" role="img" aria-label="atoms">${g}</svg>`;
  }
  const alive=c=>c.on!==false&&c.c!=="swo";
  const br=f.br||[], k=br.length, xf=k?(k>2?160:190):300;
  const xs=br.map((_,i)=>k===1?300:Math.round(xf+(300-xf)*i/(k-1)));
  const mainOK=!f.off&&(f.top||[]).every(alive)&&(f.bot||[]).every(alive);
  const bOK=br.map(b=>mainOK&&b.every(alive)&&!(f.short&&b.length));
  const mOK=mainOK&&(!k||bOK.some(Boolean));
  const sym=(c,x,y,v,ok,p)=>{
    if(c.c==="lamp"){
      const b=c.on===false?`<circle cx="${x}" cy="${y}" r="13" fill="var(--card)" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 5"/>`
        :`<circle cx="${x}" cy="${y}" r="13" fill="${ok?LIT:"var(--card)"}" ${st}/><path d="M${x-9} ${y-9}l18 18M${x+9} ${y-9}l-18 18" fill="none" ${st}/>`;
      return f.play?`<g class="tap" data-p="${p}"><circle cx="${x}" cy="${y}" r="24" fill="transparent"/>${b}</g>`:b; }
    if(c.c==="res") return v?`<rect x="${x-8}" y="${y-20}" width="16" height="40" rx="2" fill="var(--card)" ${st}/>`:`<rect x="${x-20}" y="${y-8}" width="40" height="16" rx="2" fill="var(--card)" ${st}/>`;
    if(c.c==="sw"||c.c==="swo") return `<rect x="${x-20}" y="${y-18}" width="40" height="30" fill="var(--card)"/><path d="M${x-20} ${y}L${c.c==="sw"?(x+20)+" "+y:(x+14)+" "+(y-16)}" fill="none" ${st}/><circle cx="${x-20}" cy="${y}" r="3.5" fill="currentColor"/><circle cx="${x+20}" cy="${y}" r="3.5" fill="currentColor"/>`;
    return `<circle cx="${x}" cy="${y}" r="13" fill="var(--card)" ${st}/><text x="${x}" y="${y+5}" text-anchor="middle" class="ft">${c.c==="mot"?"M":c.c}</text>`;
  };
  const hz=(c,x,y,p)=>{
    if(c.vm) return `<path d="M${x-32} ${y}V${y-38}H${x+32}V${y}" fill="none" ${st}/>${dot(x-32,y)}${dot(x+32,y)}${sym({c:c.vm},x,y-38)}${sym(c,x,y,false,mOK,p)}${tx(x,y+30,c.n)}${tx(x,y+46,c.l)}${tx(x+40,y-34,c.vl,"start")}`;
    return sym(c,x,y,false,mOK,p)+tx(x,y-20,c.n)+tx(x,y+30,c.l);
  };
  const vt=(c,x,y,ok,p)=>sym(c,x,y,true,ok,p)+(T(c.l)?tx(x-20,y-3,c.n,"end")+tx(x-20,y+13,c.l,"end"):tx(x-20,y+5,c.n,"end"));
  let d="M40 60H300V170H40Z"; xs.slice(0,-1).forEach(x=>d+=`M${x} 60V170`);
  let g=`<path d="${d}" fill="none" ${st}/>`;
  if(f.flow){ const m=(f.spd||1)*(f.fast||f.short?.3:1);
    if(!k){ if(mainOK) g+=flowPath("M40 109V60H300V170H40V121",0,1,m); }
    else xs.forEach((x,i)=>{ if(bOK[i]) g+=flowPath(`M40 109V60H${x}V170H40V121`,i,k,m/((f.w||[])[i]||1)); }); }
  xs.slice(0,-1).forEach(x=>g+=dot(x,60)+dot(x,170));
  g+=PILE;
  const span=(a,y,n)=>(a||[]).map((c,i)=>hz(c,Math.round(40+(xf-40)*(i+1)/(a.length+1)),y,n+"."+i)).join("");
  g+=span(f.top,60,"top")+span(f.bot,170,"bot");
  br.forEach((b,i)=>b.forEach((c,j)=>g+=vt(c,xs[i],b.length===1?115:(j?143:88),bOK[i],"br."+i+"."+j)));
  g+=tx(62,120,f.g,"start");
  if(f.i) g+=k?tx((40+xf)/2,50,f.i):tx(170,150,f.i);
  if(f.arr){ const tri=(x,y,s)=>`<path d="M${x-7*s} ${y-7}L${x+7*s} ${y}L${x-7*s} ${y+7}Z" fill="var(--red)"/>`; g+=tri(72,60,f.arr)+tri(72,170,-f.arr)+tri(268,60,f.arr)+tri(268,170,-f.arr); }
  return `<svg viewBox="0 0 340 208" role="img" aria-label="circuit">${g}</svg>`;
}

/* circuit where a meter is dropped either in the loop ("ser") or across the lamp ("par") */
const PRES={Aser:{fr:"Mesure : 0,30 A",en:"Reading: 0.30 A"},Apar:{fr:"Lampe court-circuitée !",en:"Lamp short-circuited!"},Vpar:{fr:"Mesure : 4,5 V",en:"Reading: 4.5 V"},Vser:{fr:"Presque aucun courant",en:"Almost no current"}};
function placeSVG(kd,pos,run){
  const st=ST, short=run&&kd==="A"&&pos==="par", dead=run&&kd==="V"&&pos==="ser", lampOn=run&&!short&&!dead;
  const met=(x,y,z)=>pos===z?`<circle cx="${x}" cy="${y}" r="15" fill="var(--volt)" ${st}/><text x="${x}" y="${y+5}" text-anchor="middle" class="ft" style="fill:#14213d">${kd}</text>`
    :run?"":`<g class="zone" data-z="${z}"><rect x="${x-28}" y="${y-22}" width="56" height="44" fill="transparent"/><circle cx="${x}" cy="${y}" r="15" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="5 5"/><text x="${x}" y="${y+5}" text-anchor="middle" class="ft" style="fill:var(--accent)">${kd}</text></g>`;
  let g=`<path d="M40 60H300V170H40Z" fill="none" ${st}/>`;
  if(pos==="par") g+=`<path d="M136 60V24H204V60" fill="none" ${st}/><circle cx="136" cy="60" r="4.5" fill="currentColor"/><circle cx="204" cy="60" r="4.5" fill="currentColor"/>`;
  else if(!run) g+=`<path d="M136 60V24H204V60" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 6"/>`;
  if(run&&!dead) g+=flowPath(short?"M40 109V60H136V24H204V60H300V170H40V121":"M40 109V60H300V170H40V121",0,1,short?.3:1);
  g+=PILE+`<circle cx="170" cy="60" r="13" fill="${lampOn?LIT:"var(--card)"}" ${st}/><path d="M161 51l18 18M179 51l-18 18" fill="none" ${st}/><text x="170" y="92" text-anchor="middle" class="ft">L</text>`;
  g+=`<rect x="85" y="152" width="40" height="30" fill="var(--card)"/><path d="M85 170L${run?"125 170":"119 154"}" fill="none" ${st}/><circle cx="85" cy="170" r="3.5" fill="currentColor"/><circle cx="125" cy="170" r="3.5" fill="currentColor"/>`;
  g+=met(235,170,"ser")+met(170,24,"par")+`<text x="62" y="120" class="ft">${fmt(4.5)} V</text>`;
  if(run) g+=`<text x="190" y="130" text-anchor="middle" class="ft${short||dead?" hl":""}" style="font-size:15px">${T(PRES[kd+pos])}</text>`;
  return `<svg viewBox="0 0 340 208" role="img" aria-label="circuit">${g}</svg>`;
}

function meterSVG(m){
  const ang={V:180,OFF:270,A:0,O:90}[m[0]], scr={V:"0.00 V",A:"0.00 A",O:"0.L Ω",OFF:""}[m[0]]||"", K="#14213d";
  const sock=(x,l)=>`<circle cx="${x}" cy="210" r="10" fill="${K}"/><text x="${x}" y="238">${l}</text>`;
  const plug=x=>`<circle cx="${x}" cy="210" r="7" fill="#e9eef5" stroke="#7b8799" stroke-width="2"/>`;
  return `<svg class="meter" viewBox="0 0 200 250" role="img" aria-label="multimeter">
    <rect x="20" y="4" width="160" height="242" rx="22" fill="#f5b700" stroke="${K}" stroke-width="3"/>
    <rect x="38" y="20" width="124" height="40" rx="6" fill="#d5e0cf" stroke="${K}" stroke-width="2"/><text x="154" y="47" class="lcd">${scr}</text>
    <circle cx="100" cy="124" r="30" fill="${K}"/>${ang==null?"":`<line x1="100" y1="124" x2="124" y2="124" stroke="#f5b700" stroke-width="5" stroke-linecap="round" transform="rotate(${ang} 100 124)"/>`}
    <text x="52" y="129">V</text><text x="100" y="86">OFF</text><text x="148" y="129">A</text><text x="100" y="174">Ω</text>
    ${sock(55,"A")}${sock(100,"COM")}${sock(145,"VΩ")}${m[1]?plug(100)+plug(m[1]==="A"?55:145):""}</svg>`;
}
